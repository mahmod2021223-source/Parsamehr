<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>

.it{width:100%;border-collapse:collapse}.it td{padding:9px 14px;border-bottom:1px solid #e5ecf7;font-size:14px;vertical-align:top}.it thead td{padding:0;background:linear-gradient(135deg,#0b1f4d,#1d4ed8);border:0}
.ih{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff}.ih img{width:56px;height:56px;border-radius:14px;background:#fff2;object-fit:contain}.it1{flex:1;display:flex;flex-direction:column}.it1 b{font-size:22px}.it1 span{font-size:15px;opacity:.92}.it2{font-size:12px;opacity:.9;text-align:left;line-height:1.7}
.br td{background:#0b1f4d;color:#fff;font-weight:800;font-size:16px;padding:8px 14px}.ct td{background:#e0ecff;color:#1e3a8a;font-weight:700;font-size:13px;padding:5px 14px}.it small{display:block;color:#64748b;font-size:11px}.pc{text-align:left;white-space:nowrap;font-weight:800;color:#1d4ed8;width:1%}.em{text-align:center;color:#64748b;padding:30px!important}
@page{size:A4;margin:12mm 10mm 16mm;@bottom-center{content:"صفحه " counter(page) " از " counter(pages);font:11px Vazirmatn,Tahoma,sans-serif;color:#475569}}
@media print{#inv{width:auto!important;zoom:1!important;box-shadow:none!important;border-radius:0!important}#ivw{padding:0!important;margin:0!important;display:block!important}.it thead{display:table-header-group}.it tr{break-inside:avoid;page-break-inside:avoid}.ih,.br td,.ct td,.it thead td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>

<script>

[17,8,"فلش Qualcomm|EDL Software Repair|رفع مشکل EDL|ترمیم نرم‌افزاری Qualcomm|رفع Bootloop"],
[17,13,"نصب نرم‌افزارهای عمومی|نصب نرم‌افزارهای تخصصی|آپدیت برنامه‌ها|رفع خطای برنامه‌ها|رفع مشکل Google Play|رفع مشکل Play Services|رفع مشکل همگام‌سازی|پاک‌سازی نرم‌افزاری|ویروس‌یابی و رفع بدافزار|فعال‌سازی سرویس‌های نرم‌افزاری"],
[17,9,"بازیابی اطلاعات نرم‌افزاری|بازیابی عکس و فیلم|بازیابی مخاطبین|بازیابی پیامک|بازیابی اطلاعات بعد از ریست|بازیابی اطلاعات بعد از فلش"],
[17,10,"انتقال اطلاعات گوشی به گوشی|بکاپ‌گیری اطلاعات|انتقال اطلاعات Android به Android|انتقال اطلاعات Android به iPhone|انتقال اطلاعات iPhone به iPhone"],
[17,11,"Unlock Bootloader|قفل کردن Bootloader|روت دستگاه|نصب Magisk|رفع مشکل Magisk|Patched Boot|Patched Init Boot|فلش Boot|فلش Init Boot|نصب Custom Recovery"],
[17,12,"نصب رام کاستوم|نصب Custom ROM|نصب GApps|نصب Kernel|نصب مود و پچ"],[17,6,"نصب فایل تعمیراتی|Repair Firmware|Repair File|Dump / Backup در موارد مجاز"],
[17,14,"عیب‌یابی نرم‌افزاری|تشخیص علت خاموشی نرم‌افزاری|تشخیص Bootloop|تشخیص مشکل آنتن نرم‌افزاری|تشخیص مشکل شارژ نرم‌افزاری|تشخیص مشکل دوربین نرم‌افزاری|تشخیص مشکل سنسورها|تشخیص مشکل Wi-Fi|تشخیص مشکل Bluetooth|تشخیص مشکل شبکه"]];
const DEF='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#g)"/><path d="M30 70V30h22a15 15 0 010 30H42" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/></svg>');
const K='parsamehr_v1';let S,V={g:null,q:'',c:'',y:{}};
function seed(){let i=0,r=[];SEED.forEach(([b,c,n])=>n.split('|').forEach(m=>r.push({id:'s'+ ++i,name:m,brand:BR[b],cat:CT[c],price:'',desc:'',active:true,order:i*10})));return r}
try{S=JSON.parse(localStorage.getItem(K))}catch(_){}if(!S||!S.svc)S={svc:seed(),logo:'',theme:''};
const save=()=>{S.upd=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(_){toast('ذخیره‌سازی در این مرورگر ممکن نیست')}};
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',2600)};
const yi=s=>S.yrs.findIndex(y=>y.id==s.yr),srt=(a,b)=>BR.indexOf(a.brand)-BR.indexOf(b.brand)||CT.indexOf(a.cat)-CT.indexOf(b.cat)||yi(a)-yi(b)||a.order-b.order;
function migrate(){if(!S.yrs)S.yrs=[{id:'y1',label:'2015 تا 2017',active:true},{id:'y2',label:'2018 تا 2026',active:true}];const a=[];S.svc.forEach(s=>{if(s.cat=='Flash & ROM'&&!s.yr){s.yr=S.yrs[0].id;S.yrs.slice(1).forEach(y=>a.push({...s,id:s.id+'_'+y.id,yr:y.id}))}});if(a.length){S.svc.push(...a);save()}}
const f2e=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fmt=p=>p?(+p).toLocaleString('en-US'):'';

$('#th').onclick=()=>{const d=document.documentElement.dataset.theme?document.documentElement.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=d?'light':'dark';applyTheme();save()};

GR.forEach(([n,bs],i)=>{const l=S.svc.filter(s=>bs.includes(s.brand)),p=l.filter(s=>s.price).length;h+=`<button class="card" style="background:linear-gradient(135deg,hsl(${200+i*22} 80% 45%),hsl(${230+i*22} 70% 38%))" onclick="list(${i})"><b>${n}</b><small>${l.length} خدمت · ${p} قیمت‌گذاری‌شده</small></button>`});

if(ml&&s.brand!=pb){h+=`<div class="gh">${s.brand}</div>`;pb=s.brand;pc=''}if(s.cat!=pc){h+=`<div class="ch">${s.cat}${s.cat==FL?ysel(s.brand):''}</div>`;pc=s.cat}if(s.marker){if(!yv(s.brand))h+='<div style="color:var(--mu);font-size:13px;padding:4px 2px 8px">ابتدا سال ساخت گوشی را انتخاب کنید.</div>';return}

$('#ls').innerHTML=h||'<p style="color:var(--mu)">موردی یافت نشد.</p>'}

const dg=$('#dg'),opts=a=>a.map(o=>`<option>${o}</option>`).join('');
function edit(id){const s=id?gs(id):{name:'',brand:V.g>=0&&V.g!=null?GR[V.g][1][0]:'General Software Services',cat:V.c||CT[13],price:'',desc:'',active:true,order:(Math.max(0,...S.svc.map(x=>x.order))+10)};
dg.innerHTML=`<div class="f"><b>${id?'ویرایش':'افزودن'} خدمت</b><label>نام خدمت</label><input id="en" value="${e(s.name)}"><label>مدل گوشی (اختیاری)</label><input id="em" value="${e(s.model||'')}"><label>برند</label><select id="eb">${opts(BR)}</select><label>دسته‌بندی</label><select id="ec">${opts(CT)}</select><div id="yw"><label>سال ساخت (برای Flash & ROM)</label><select id="ey">${S.yrs.map(y=>`<option value="${y.id}">${e(y.label)}</option>`).join('')}</select></div><label>قیمت (تومان)</label><input id="ep" inputmode="numeric" value="${fmt(s.price)}"><label>توضیحات</label><textarea id="ed" rows="2">${e(s.desc)}</textarea><label>ترتیب نمایش</label><input id="eo" type="number" value="${s.order}"><p style="display:flex;gap:8px"><button class="b" id="sv">ذخیره</button><button class="b s" onclick="dg.close()">انصراف</button></p></div>`;
$('#eb').value=s.brand;$('#ec').value=s.cat;$('#ey').value=s.yr||V.y[s.brand]||S.yrs[0].id;const tg=()=>$('#yw').style.display=$('#ec').value==FL?'':'none';tg();$('#ec').onchange=tg;dg.showModal();
$('#sv').onclick=()=>{const n=$('#en').value.trim();if(!n)return toast('نام خدمت لازم است');Object.assign(s,{name:n,model:$('#em').value.trim(),brand:$('#eb').value,cat:$('#ec').value,price:f2e($('#ep').value).replace(/\D/g,''),desc:$('#ed').value.trim(),order:+$('#eo').value||0,yr:$('#ec').value==FL?$('#ey').value:undefined});if(!id){s.id='n'+Date.now();S.svc.push(s)}if(s.cat==FL)V.y[s.brand]=s.yr;save();dg.close();V.g==null?home():rows()}}
function yrs(){dg.innerHTML=`<div class="f"><b>مدیریت بازه‌های سال ساخت</b><p style="color:var(--mu);font-size:12px;margin:4px 0">بازه‌ها برای همه برندها یکسان است. با افزودن بازه جدید، برای هر خدمت فلش یک نسخه (با قیمت خالی) ساخته می‌شود.</p>${S.yrs.map(y=>`<div class="row" style="grid-template-columns:1fr auto" data-y="${y.id}"><input class="yl" value="${e(y.label)}"><div class="ac" style="grid-column:auto"><label><input type="checkbox" class="yt" ${y.active?'checked':''}> فعال</label><button class="b r" data-a="yd">حذف</button></div></div>`).join('')}<p style="display:flex;gap:8px"><input id="yn" placeholder="مثلاً 2027 تا 2030"><button class="b" id="ya">افزودن</button></p><button class="b s" onclick="dg.close()">بستن</button></div>`;dg.showModal()}
dg.addEventListener('input',x=>{const t=x.target;if(t.classList.contains('yl')){S.yrs.find(y=>y.id==t.closest('[data-y]').dataset.y).label=t.value;save()}});
dg.addEventListener('change',x=>{const t=x.target;if(t.classList.contains('yt')){S.yrs.find(y=>y.id==t.closest('[data-y]').dataset.y).active=t.checked;save()}});
dg.addEventListener('click',x=>{const t=x.target;if(t.dataset.a=='yd'){const id=t.closest('[data-y]').dataset.y;if(confirm('این بازه و تمام خدمات فلش آن حذف شود؟')){S.yrs=S.yrs.filter(y=>y.id!=id);S.svc=S.svc.filter(s=>s.yr!=id);save();yrs()}}if(t.id=='ya'){const l=$('#yn').value.trim();if(!l)return;const id='y'+Date.now(),base=S.yrs[0]&&S.yrs[0].id;S.yrs.push({id,label:l,active:true});S.svc.filter(s=>s.cat==FL&&s.yr==base).forEach((s,i)=>S.svc.push({...s,id:'n'+Date.now()+'_'+i,yr:id,price:''}));save();yrs()}});
dg.addEventListener('close',()=>{if(V.g!=null&&$('#ls'))rows()});
function bk(){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'parsamehr-backup.json')}
$('#bf').onchange=async x=>{try{const d=JSON.parse(await x.target.files[0].text());if(!d.svc)throw 0;S=d;migrate();save();applyTheme();V.g==null?home():list(V.g);toast('بازیابی شد')}catch(_){toast('فایل پشتیبان نامعتبر است')}x.target.value=''};
$('#lf').onchange=x=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL('image/png');save();applyTheme();toast('لوگو تغییر کرد')};im.src=r.result};r.readAsDataURL(x.target.files[0]);x.target.value=''};
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
const vals=n=>[...dg.querySelectorAll(`[name=${n}]:checked`)].map(i=>i.value);
const yl=s=>(S.yrs.find(y=>y.id==s.yr)||{}).label||'',pt=s=>s.price?fmt(s.price)+' تومان':'تماس بگیرید';
function openShare(){const pre=V.g>=0&&V.g!=null?GR[V.g][1]:[],ck=(a,p)=>a.map(v=>`<label><input type="checkbox" name="${p}" value="${v}" ${p=='b'&&pre.includes(v)?'checked':''}>${v}</label>`).join('');
dg.innerHTML=`<div class="f"><b>ارسال لیست خدمات</b><label>برندها (بدون انتخاب = همه)</label><div class="chk">${ck(BR,'b')}</div><label>دسته‌بندی‌ها (بدون انتخاب = همه)</label><div class="chk">${ck(CT,'c')}</div><label>سال ساخت</label><select id="xy"><option value="">همه</option>${S.yrs.map(y=>`<option value="${y.id}">${e(y.label)}</option>`).join('')}</select><div class="chk" style="margin-top:8px"><label><input type="checkbox" id="xp" checked>فقط خدمات دارای قیمت</label><label><input type="checkbox" id="xi">شامل غیرفعال‌ها</label></div><p style="display:flex;gap:8px"><button class="b" id="go">نمایش و ارسال</button><button class="b s" onclick="dg.close()">انصراف</button></p></div>`;dg.showModal();
$('#go').onclick=()=>{const bs=vals('b'),cs=vals('c'),y=$('#xy').value,pr=$('#xp').checked,ia=$('#xi').checked;
const it=S.svc.filter(s=>(ia||s.active)&&(ia||!s.yr||(S.yrs.find(r=>r.id==s.yr)||{active:0}).active)&&(!bs.length||bs.includes(s.brand))&&(!cs.length||cs.includes(s.cat))&&(!y||!s.yr||s.yr==y)&&(!pr||s.price)).sort(srt);
if(!it.length)return toast('خدمتی پیدا نشد (قیمت‌ها را وارد کنید یا فیلتر را تغییر دهید)');dg.close();share(it)}}
function buildText(it){const R='\u200F',L=[R+'📋 *پارسامهر | نرخ‌نامه تعمیرات موبایل*',R+new Date().toLocaleDateString('fa-IR'),''];let pb='';
it.forEach(s=>{if(s.brand!=pb){L.push(R+'📱 *خدمات '+s.brand+'*','');pb=s.brand}
if(s.model)L.push(R+'مدل: '+s.model);if(s.yr)L.push(R+'سال ساخت: '+yl(s));
L.push(R+'🔧 '+s.name,R+'📂 دسته: '+s.cat,R+'💰 قیمت: '+pt(s));if(s.desc)L.push(R+'📝 '+s.desc);L.push(R+'وضعیت: '+(s.active?'✅ فعال':'⛔ غیرفعال'),R+'──────────')});
return L.join('\n')}
async function copyT(t){try{await navigator.clipboard.writeText(t);toast('متن کپی شد ✓')}catch(_){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('متن کپی شد ✓')}catch(__){toast('کپی ممکن نشد')}a.remove()}}
async function wa(t){if(navigator.share){try{await navigator.share({title:'نرخ‌نامه پارسامهر',text:t});return}catch(x){if(x&&x.name=='AbortError')return}}
const u='https://wa.me/?text='+encodeURIComponent(t);if(u.length>6000){copyT(t);toast('متن طولانی است؛ کپی شد. در واتساپ Paste کنید');window.open('https://wa.me/','_blank');return}
const w=window.open(u,'_blank');if(!w)location.href=u}
function share(it){const t=buildText(it),sv=$('#sv');let h='',pb='';
it.forEach(s=>{if(s.brand!=pb){h+=`<h2>${e(s.brand)}</h2>`;pb=s.brand}
h+=`<div class="sk ${s.active?'':'off'}"><div class="sn">${e(s.name)}</div><div class="tg"><span>${e(s.cat)}</span>${s.model?`<span>مدل: <bdi>${e(s.model)}</bdi></span>`:''}${s.yr?`<span>سال ساخت: <bdi>${e(yl(s))}</bdi></span>`:''}<span>${s.active?'✅ فعال':'⛔ غیرفعال'}</span></div>${s.desc?`<p>${e(s.desc)}</p>`:''}<div class="sp">💰 <bdi>${e(pt(s))}</bdi></div></div>`});
sv.innerHTML=`<div class="sb"><button class="b" id="wa">ارسال در واتساپ</button><button class="b s" id="cp">کپی متن</button><button class="b s" id="pt">چاپ / ذخیره به PDF</button><button class="b s" id="xc">بستن</button></div><div class="sc"><h1>پارسامهر | نرخ‌نامه تعمیرات موبایل</h1><div class="sd">${new Date().toLocaleDateString('fa-IR')} · ${it.length} خدمت</div>${h}</div>`;sv.style.display='block';sv.classList.add('op');sv.scrollTop=0;
$('#wa').onclick=()=>wa(t);$('#cp').onclick=()=>copyT(t);$('#pt').onclick=()=>window.print();$('#xc').onclick=()=>{sv.style.display='none';sv.classList.remove('op')}}

const I={b:[],c:'',q:'',p:true},IMG={b:null};
const invItems=()=>S.svc.filter(s=>s.active&&(!s.yr||(S.yrs.find(r=>r.id==s.yr)||{active:0}).active)&&(!I.b.length||I.b.includes(s.brand))&&(!I.c||s.cat==I.c)&&(!I.p||s.price)&&(s.name+(s.model||'')+(s.desc||'')).toLowerCase().includes(I.q)).sort(srt);
function fit(){const w=$('#inv');if(w)w.style.zoom=Math.min(1,(innerWidth-24)/720)}addEventListener('resize',fit);
function invDraw(){const it=invItems(),n=it.length;let h='',pb='',pc='';IMG.b=null;
it.forEach(s=>{if(s.brand!=pb){h+=`<tr class="br"><td colspan="2">${e(s.brand)}</td></tr>`;pb=s.brand;pc=''}
if(s.cat!=pc){h+=`<tr class="ct"><td colspan="2">${e(s.cat)}</td></tr>`;pc=s.cat}
const m=[s.model,s.yr&&'سال ساخت: '+yl(s),s.desc].filter(Boolean).map(e).join(' · ');
h+=`<tr><td>${e(s.name)}${m?`<small>${m}</small>`:''}</td><td class="pc"><bdi>${e(pt(s))}</bdi></td></tr>`});
const d=new Date(S.upd||Date.now()).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'});
$('#inv').innerHTML=`<table class="it"><thead><tr><td colspan="2"><div class="ih"><img src="${S.logo||DEF}" alt=""><div class="it1"><b>پارسامهر</b><span>نرخ‌نامه خدمات نرم‌افزاری موبایل</span></div><div class="it2">آخرین به‌روزرسانی<br>${d}<br>${n} خدمت</div></div></td></tr></thead><tbody>${h||'<tr><td colspan="2" class="em">خدمتی برای نمایش نیست. قیمت‌ها را وارد کنید یا «فقط خدمات دارای قیمت» را بردارید.</td></tr>'}</tbody></table>`;
$('#icn').textContent=n+' خدمت';fit()}
function invText(it){const R='\u200F',L=[R+'🧾 *پارسامهر | نرخ‌نامه خدمات نرم‌افزاری موبایل*',R+'🕒 '+new Date(S.upd||Date.now()).toLocaleString('fa-IR')];let pb='',pc='';
it.forEach(s=>{if(s.brand!=pb){L.push('',R+'📱 *'+s.brand+'*');pb=s.brand;pc=''}if(s.cat!=pc){L.push(R+'🔧 '+s.cat);pc=s.cat}
L.push(R+'▫️ '+s.name+(s.model?' ('+s.model+')':'')+(s.yr?' ['+yl(s)+']':'')+' — 💰 '+pt(s))});return L.join('\n')}
const h2c=()=>window.html2canvas?Promise.resolve(window.html2canvas):new Promise((r,j)=>{const a=document.createElement('script');a.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';a.onload=()=>r(window.html2canvas);a.onerror=j;document.head.appendChild(a)});
async function inImg(){if(IMG.b)return IMG.b;const el=$('#inv');toast('در حال ساخت تصویر...');try{const f=await h2c();try{await document.fonts.ready}catch(_){}
const n=el.querySelectorAll('tr').length,c=await f(el,{scale:n<=120?2:n<=250?1.5:1,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:720,onclone:d=>{const v=d.getElementById('iv');v.style.cssText='position:static;overflow:visible;display:block';const i=d.getElementById('inv');i.style.zoom='1';i.style.width='720px'}});
return IMG.b=await new Promise(r=>c.toBlob(r,'image/png'))}catch(x){toast('ساخت تصویر ممکن نشد؛ از صفحه اسکرین‌شات بگیرید');return null}}
async function inShare(){const b=await inImg();if(!b)return;const f=new File([b],'parsamehr-pricelist.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'نرخ‌نامه پارسامهر'});return}catch(x){if(x&&x.name=='AbortError')return;if(x&&x.name=='NotAllowedError')return toast('تصویر آماده شد؛ یک‌بار دیگر «اشتراک‌گذاری» را بزنید')}}
dl(b,'parsamehr-pricelist.png');toast('اشتراک تصویر پشتیبانی نشد؛ تصویر ذخیره شد')}
function openInv(){const v=$('#iv');I.b=[];I.c='';I.q='';I.p=true;IMG.b=null;const bs=BR.filter(b=>S.svc.some(s=>s.active&&s.brand==b));
v.innerHTML=`<div class="sb"><button class="b" id="ipr">چاپ نرخ‌نامه جامع</button><button class="b s" id="iim">ذخیره تصویر</button><button class="b s" id="ish">اشتراک‌گذاری</button><button class="b" id="iwa">ارسال در واتساپ</button><button class="b s" id="ico">کپی متن نرخ‌نامه</button><button class="b s" id="ixc">بستن</button></div><div class="ifl"><div class="tb" style="margin:0 0 8px"><input id="iq" placeholder="جستجوی نام خدمت..."><select id="ic"><option value="">همه دسته‌ها</option>${opts(CT)}</select></div><div class="chk">${bs.map(b=>`<label><input type="checkbox" name="ib" value="${e(b)}">${e(b)}</label>`).join('')}</div><p style="margin:8px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="b s" id="iall">همه برندها</button><label><input type="checkbox" id="ipp" checked> فقط خدمات دارای قیمت</label><span id="icn" style="color:var(--mu);font-size:13px"></span></p></div><div id="ivw"><div id="inv"></div></div>`;
$('#ipr').onclick=()=>window.print();$('#iim').onclick=async()=>{const b=await inImg();if(b){dl(b,'parsamehr-pricelist.png');toast('تصویر ذخیره شد ✓')}};$('#ish').onclick=inShare;
$('#iwa').onclick=()=>wa(invText(invItems()));$('#ico').onclick=()=>copyT(invText(invItems()));$('#ixc').onclick=()=>{v.style.display='none';v.classList.remove('op')};
$('#iq').oninput=x=>{I.q=x.target.value.toLowerCase();invDraw()};$('#ic').onchange=x=>{I.c=x.target.value;invDraw()};$('#ipp').onchange=x=>{I.p=x.target.checked;invDraw()};
v.querySelectorAll('[name=ib]').forEach(c=>c.onchange=()=>{I.b=[...v.querySelectorAll('[name=ib]:checked')].map(i=>i.value);invDraw()});
$('#iall').onclick=()=>{v.querySelectorAll('[name=ib]').forEach(c=>c.checked=false);I.b=[];invDraw()};
v.classList.add('op');v.style.display='block';v.scrollTop=0;invDraw()}
applyTheme();home();
</script></body></html>
