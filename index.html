let SC={t:[],done:false,ex:'',err:'',sci:false,deg:true,pan:''},SU={c:0,f:0,t:1,v:'',res:null},SCH=null;

function scKey(k){
 if(k=='C'){SC.t=[];SC.done=false;SC.ex='';SC.err='';return scUp()}
 SC.err='';
 if(SC.done){if(k=='=')return scUp();SC.done=false;SC.ex='';if(!(k.length==1&&'+-*/^%!B'.includes(k)))SC.t=[]}

 else if(k=='.'){if(l&&scIsNum(l)){if(!l.includes('.'))T[T.length-1]=l+'.'}else T.push('0.')}

  if(l==null){if(k=='-')T.push('-')}

   else T[T.length-1]=k}

 else if(k=='P'){let o=0;T.forEach(x=>{if(scPar(x))o++;else if(x==')')o--});if(o>0&&scVal(l))T.push(')');else T.push('(')}
 else if(scOpn(k)||k=='pi'||k=='e'){T.push(k)}

 scUp()}

 if(st!=='play')return;

 var n=snake.length,pad=CELL*.08;

 var stl=document.createElement('style');stl.textContent=(cssEl?cssEl.textContent:'')+'\n.bk{border:0;border-radius:11%;background:url("'+CG.backURI+'") center/100% 100% no-repeat;box-shadow:0 1px 4px rgba(0,0,0,.6)}';

 BK=[null,R.querySelector('.p1 .hkbk'),R.querySelector('.p2 .hkbk'),R.querySelector('.p3 .hkbk')];
 CH=[R.querySelector('#hkme0'),R.querySelector('.p1 .hkn'),R.querySelector('.p2 .hkn'),R.querySelector('.p3 .hkn')];
 R.addEventListener('click',function(e){

  if(b){act(b.getAttribute('data-a'),b.getAttribute('data-v'));return}
 });
 HH.addEventListener('click',function(e){

 });
 R.addEventListener('touchmove',function(e){if(!(e.target.closest&&e.target.closest('.hkpn')))e.preventDefault()},{passive:false});
 window.addEventListener('resize',function(){if(alive())setTimeout(relayout,60)});
 window.addEventListener('orientationchange',function(){if(alive())setTimeout(relayout,250)});
}

function relayout(){
 if(!R||!alive())return;
 var W=R.clientWidth,H=R.clientHeight,iw=W-20;
 ROWS2=H>=500;
 if(ROWS2)CW=Math.max(40,Math.min(72,Math.floor(iw/(1+6*.62)),Math.floor(H*.25/(1.42*1.46))));
 else CW=Math.max(34,Math.min(54,Math.floor(H*.19)));
 var ch=Math.round(CW*1.42);
 HH.style.height=(ROWS2?Math.round(ch*1.46):ch)+4+'px';
 BW=Math.max(20,Math.min(30,Math.floor(Math.min(W*.075,H*.045))));
 R.style.setProperty('--cw',CW+'px');R.style.setProperty('--bw',BW+'px');
 var p2=R.querySelector('.p2'),p1=R.querySelector('.p1'),p3=R.querySelector('.p3');
 var st=p2.offsetTop+p2.offsetHeight+6,sl=Math.max(p1.offsetWidth,p3.offsetWidth)+14;
 R.style.setProperty('--st',st+'px');R.style.setProperty('--sl',sl+'px');
 var cw=CT.clientWidth,chh=CT.clientHeight;
 TCW=Math.max(38,Math.min(62,Math.floor(Math.min(cw*.29,chh*.31))));
 R.style.setProperty('--tcw',TCW+'px');
 R.style.setProperty('--md',Math.max(80,Math.floor(Math.min(cw,chh)*.86))+'px');
 if(G&&G.phase==='play'||G&&G.phase==='trump')renderHand(false);
}

/* ---------- نمایش ---------- */
function status(t,cls){ST.textContent=t;ST.className='hkst'+(cls?' '+cls:'')}
function chips(){
 for(var s=0;s<4;s++){
  var hk=G&&G.hakem===s,isP=s===2;
  CH[s].innerHTML='<span class="av">'+AV[s]+'</span><span>'+NAMES[s]+'</span>'+(isP?'<em>یار</em>':'')+(hk?'<span class="cr">👑</span>':'');
 }
}
function setActive(seat){
 for(var s=0;s<4;s++){
  var on=s===seat;
  if(s===0)CH[0].classList.toggle('act',on);else CH[s].parentNode.classList.toggle('act',on);
 }
}
function hud(){
 var el=R.querySelector('#hkhud'),g=G||{score:[0,0],rounds:[0,0],tricks:[0,0],trump:-1,hakem:-1,target:cfg.target};
 function team(t,cls,title,sub){
  var pips='';for(var i=0;i<7;i++)pips+='<i'+(g.tricks[t]>i?' class="on"':'')+'></i>';
  return '<div class="hkm-t '+cls+'"><small>'+title+'</small><div class="pt">'+pd(g.score[t])+'<span>از '+pd(g.target)+'</span></div>'
   +'<div class="pp">'+pips+'</div><small>دست: '+pd(g.tricks[t])+' · دور برده: '+pd(g.rounds[t])+'</small></div>';
 }
 var tr=g.trump,mid='<div class="hkm-m"><small>خال حکم</small>'
  +(tr>=0?'<div class="ts'+(tr===1||tr===2?' red':'')+'">'+SY[tr]+'</div><span>'+SN[tr]+'</span>':'<div class="ts">؟</div><span>—</span>')
  +'</div>';
 el.innerHTML=team(0,'a','تیم شما','')+mid+team(1,'b','تیم حریف','');
 var b=R.querySelector('#hksnd');if(b)b.textContent=cfg.snd?'🔊':'🔇';
}
function setBacks(seat,n,pop){
 var c=BK[seat];if(!c)return;
 while(c.children.length>n)c.removeChild(c.lastChild);
 var add=0;
 while(c.children.length<n){var d=document.createElement('div');d.className='bk'+(pop?' nw':'');if(pop)d.style.animationDelay=(add++*35)+'ms';c.appendChild(d)}
}
function clearTable(){
 Object.keys(handEls).forEach(function(k){if(handEls[k].parentNode)handEls[k].parentNode.removeChild(handEls[k])});
 handEls={};
 SL.forEach(function(s){s.innerHTML=''});
 for(var s=1;s<4;s++)setBacks(s,0);
 humanTurn=false;
}

/* ---------- دست بازیکن انسانی ---------- */
function renderHand(deal){
 if(!G)return;
 var hand=G.hands[0],n=hand.length,iw=R.clientWidth-20,cw=CW,ch=Math.round(cw*1.42);
 var two=ROWS2&&n>5,r1=two?Math.ceil(n/2):n,r2=n-r1;
 hand.forEach(function(c,i){
  var el=handEls[c];
  if(!el){el=cardEl(c,cw);handEls[c]=el;HH.appendChild(el);if(deal){el.classList.add('dl');el.style.animationDelay=(i*30)+'ms'}}
  else{el.style.setProperty('--w',cw+'px');el.classList.toggle('tp',G.trump===Su(c))}
  var row=i<r1?0:1,idx=row?i-r1:i,m=row?r2:r1;
  var step=Math.min(cw*(ROWS2?.72:.66),(iw-cw)/Math.max(1,m-1));
  var rowW=cw+(m-1)*step,x=(iw-rowW)/2+(m-1-idx)*step;
  var y=two?(row?Math.round(ch*.46):0):(ROWS2?Math.round(ch*.23):0);
  el.style.left=Math.round(x)+'px';el.style.top=y+'px';el.style.zIndex=row*30+(m-idx);
 });
 markLegal();
}
function markLegal(){
 if(!G)return;
 var on=humanTurn&&G.phase==='play'&&G.turn===0,lgl=on?G.legalFor(0):null;
 G.hands[0].forEach(function(c){
  var el=handEls[c];if(el)el.classList.toggle('dim',!!(on&&lgl.indexOf(c)<0));
 });
}

/* ---------- جریان بازی ---------- */
function newGame(){
 gen++;block=0;blocking=false;
 G=new HE.Game({level:cfg.level,target:cfg.target});
 kotShown=false;
 ovHide();clearTable();chips();setActive(-1);hud();
 relayout();
 var dr=G.pickHakem(cfg.hakem);
 if(!dr.seq.length){
  chips();hud();status('شما حاکم اول هستید 👑');snd('win');
  after(1100,beginRound);return;
 }
 status('تعیین حاکم: ورق پخش می‌شود تا اولین آس…');
 var cnt=[0,0,0,0],step=150;
 dr.seq.forEach(function(p,i){
  after(250+i*step,function(){
   var el=cardEl(p.card,TCW);el.classList.add('tc','pop');
   el.style.setProperty('--rot',(Math.random()*8-4).toFixed(1)+'deg');
   var k=cnt[p.seat]++,off=p.seat===1||p.seat===3?[0,(k%4)*10-15]:[(k%4)*14-21,0];
   el.style.marginLeft='calc(var(--w)*-.5 + '+off[0]+'px)';el.style.marginTop='calc(var(--w)*-.71 + '+off[1]+'px)';
   el.style.zIndex=k+1;SL[p.seat].appendChild(el);snd('card');
   var kids=SL[p.seat].children;if(kids.length>4)SL[p.seat].removeChild(kids[0]);
   setActive(p.seat);
   if(i===dr.seq.length-1){
    el.classList.add('wn');
    after(500,function(){
     chips();hud();setActive(dr.seat);snd('win');
     status('«'+NAMES[dr.seat]+'» حاکم شد 👑');
     after(1300,function(){SL.forEach(function(s){s.innerHTML=''});beginRound()});
    });
   }
  });
 });
}

function beginRound(){
 if(!alive()||!G)return;
 SL.forEach(function(s){s.innerHTML=''});
 clearTable();kotShown=false;
 G.startRound();
 chips();hud();setActive(G.hakem);relayout();
 var h=G.hakem;
 if(h===0){
  status('شما حاکم هستید؛ خال حکم را انتخاب کنید');
  snd('deal');
  var tr='';
  for(var s=0;s<4;s++){
   var cnt=G.hands[0].filter(function(c){return Su(c)===s}).length;
   tr+='<button class="'+(s===1||s===2?'r':'')+'" data-a="trump" data-v="'+s+'"><i>'+SY[s]+'</i><b>'+SN[s]+'</b><small>'+pd(cnt)+' کارت</small></button>';
  }
  ovSet('<div class="hkpn"><h3>خال حکم را انتخاب کن 👑</h3><p class="sub">این ۵ کارت اول توست؛ بقیهٔ کارت‌ها بعد از انتخاب حکم پخش می‌شود.</p>'
   +'<div class="hktr" id="hktr"></div><div class="hkts">'+tr+'</div></div>',true,true);
  var box=OV.querySelector('#hktr');
  G.hands[0].forEach(function(c,i){var el=cardEl(c,Math.min(58,Math.floor((R.clientWidth-80)/4.4)));box.appendChild(el)});
  for(var q=1;q<4;q++)setBacks(q,0);
  HH.innerHTML='';handEls={};
 }else{
  setBacks(h,5,true);
  status('«'+NAMES[h]+'» در حال انتخاب خال حکم است…');
  after(1100,function(){
   var t=G.aiTrump();dealAfterTrump(t,true);
  });
 }
}

function dealAfterTrump(t,byAi){
 G.setTrump(t);
 chips();hud();
 status(byAi?('«'+NAMES[G.hakem]+'» ' +SN[t]+' '+SY[t]+' را حکم کرد'):('حکم: '+SN[t]+' '+SY[t]));
 for(var s=1;s<4;s++)setBacks(s,13,true);
 for(var c in handEls){if(handEls[c].parentNode)handEls[c].parentNode.removeChild(handEls[c])}
 handEls={};HH.innerHTML='';
 renderHand(true);snd('deal');
 after(1000,next);
}

function next(){
 if(!alive()||!G||G.phase!=='play')return;
 var s=G.turn;setActive(s);
 if(s===0){
  humanTurn=true;markLegal();
  var ls2=G.leadSuit();
  status(ls2>=0?('نوبت شماست — خال دست: '+SN[ls2]+' '+SY[ls2]):'نوبت شماست — شما دست را شروع کنید','me');
 }else{
  humanTurn=false;markLegal();
  status('«'+NAMES[s]+'» در حال بازی…');
  after(380+Math.floor(Math.random()*240),function(){
   var c=G.aiChoose(s);doPlay(s,c);
  });
 }
}

function humanPlay(c,el){
 if(!G||!humanTurn||G.phase!=='play'||G.turn!==0)return;
 var lgl=G.legalFor(0);
 if(lgl.indexOf(c)<0){
  var ls2=G.leadSuit();
  if(el){el.classList.remove('sk');void el.offsetWidth;el.classList.add('sk')}
  snd('err');status('باید هم‌خال دست بازی کنید: '+SN[ls2]+' '+SY[ls2],'warn');
  return;
 }
 humanTurn=false;doPlay(0,c);
}

function doPlay(seat,card){
 var src,ev;
 if(seat===0){var he=handEls[card];src=he?he.getBoundingClientRect():R.querySelector('.hkhand').getBoundingClientRect()}
 else{
  var kids=BK[seat].children;
  src=(kids.length?kids[kids.length-1]:CH[seat]).getBoundingClientRect();
 }
 ev=G.play(seat,card);
 if(ev.error){status('خطا در نوبت‌بندی؛ دوباره تلاش می‌شود');humanTurn=false;after(300,next);return}
 if(seat===0){var h2=handEls[card];if(h2&&h2.parentNode)h2.parentNode.removeChild(h2);delete handEls[card];renderHand(false)}
 else setBacks(seat,G.hands[seat].length);
 flyIn(seat,card,src);snd('card');
 setActive(-1);
 after(340,function(){
  if(ev.type==='card'){next();return}
  afterTrick(ev);
 });
}

function flyIn(seat,card,src){
 var slot=SL[seat],el=cardEl(card,TCW);
 el.classList.add('tc');el.style.setProperty('--rot',(Math.random()*10-5).toFixed(1)+'deg');
 el.style.zIndex=slot.children.length+1;
 slot.appendChild(el);
 var f=el.getBoundingClientRect();
 var dx=(src.left+src.width/2)-(f.left+f.width/2),dy=(src.top+src.height/2)-(f.top+f.height/2),sc=Math.max(.3,src.width/f.width);
 el.style.transition='none';el.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
 void el.offsetWidth;
 el.style.transition='transform .3s cubic-bezier(.22,.9,.3,1)';
 el.style.transform='rotate(var(--rot,0deg))';
 return el;
}

function afterTrick(ev){
 var w=ev.winner,wc=SL[w].lastChild;
 if(wc)wc.classList.add('wn');
 hud();setActive(w);
 status('«'+NAMES[w]+'» دست را برد'+(ev.team===0?' ✅':''),ev.team===0?'me':'');
 snd(ev.team===0?'trick':'lose');
 if(ev.kotWatch&&!kotShown){kotShown=true;status('۷ دست کامل شد؛ تا امکان کوت هست بازی ادامه دارد','me')}
 after(750,function(){
  var t=CH[w].getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/2;
  SL.forEach(function(sl){
   var e=sl.firstChild;if(!e)return;
   var f=e.getBoundingClientRect();
   e.style.transition='transform .36s ease-in,opacity .36s ease-in';
   e.style.transform='translate('+(tx-(f.left+f.width/2))+'px,'+(ty-(f.top+f.height/2))+'px) scale(.35)';e.style.opacity='0';
  });
  after(380,function(){
   SL.forEach(function(sl){sl.innerHTML=''});
   if(ev.round){after(200,function(){endRound(ev.round)});return}
   next();
  });
 });
}

   +'<button class="hkbt" data-a="again">↻ شروع مجدد</button><button class="hkbt g" data-a="menu">تنظیمات بازی</button><button class="hkbt g" data-a="exit">خروج</button></div>',true,true);
  return;
 }
 snd(me?'win':'end');
 var nh=rd.hakemChanged?('حاکم دور بعد: «'+NAMES[rd.hakem]+'» 👑'):('«'+NAMES[rd.hakem]+'» همچنان حاکم است 👑');
 ovSet('<div class="hkpn"><div class="big">'+(me?'🎉':'😔')+'</div><h3>'+(me?'تیم شما این دور را برد':'تیم حریف این دور را برد')+'</h3>'

  +'<div class="kt">'+(rd.kind==='normal'?'+۱ امتیاز':'🔥 '+kl)+'</div>'+info
  +'<p>'+nh+'</p><button class="hkbt" data-a="nextround">▶ دور بعد</button></div>',true,true);

const NA='این دستگاه در سیستم ثبت نشده است';
function look(v){
 try{
  const ids=[v.imei1,v.imei2].filter(Boolean),sn=(v.sn||'').toLowerCase();
  if(!ids.length&&!sn)return{empty:1};
  const I=zI(),dv=(I.dv||[]),hit=[];
  dv.forEach(d=>{
   const by=[];
   ids.forEach(x=>{if(d.imei1===x)by.push('IMEI۱ ثبت‌شده');else if(d.imei2===x)by.push('IMEI۲ ثبت‌شده')});
   if(sn&&d.sn&&String(d.sn).toLowerCase()===sn)by.push('Serial');
   if(by.length)hit.push({d,by});
  });
  if(hit.length>1)return{conflict:hit};
  if(hit.length===1){
   const d=hit[0].d,mm=[];
   const chk=(lab,sc,keys)=>{if(sc&&!keys.some(k=>d[k]&&String(d[k]).toLowerCase()===String(sc).toLowerCase())&&keys.some(k=>d[k]))mm.push(lab+' روی جعبه ('+sc+') با اطلاعات ثبت‌شده تفاوت دارد')};
   chk('IMEI۱',v.imei1,['imei1','imei2']);chk('IMEI۲',v.imei2,['imei1','imei2']);chk('Serial',v.sn,['sn']);
   return{d,by:hit[0].by,mm};
  }
  /* فقط به‌عنوان سریال کالا در انبار */
  const keys=ids.concat(v.sn?[v.sn]:[]);
  const sr=(I.sr||[]).filter(x=>x.st!=='void'&&keys.some(k=>String(x.no).toLowerCase()===String(k).toLowerCase()));
  if(sr.length===1)return{sr:sr[0]};
  if(sr.length>1)return{conflict:sr.map(x=>({sr:x}))};
  return{none:1};
 }catch(e){return{err:e.message}}
}

function histOf(d,sr){

/* ---- رمزگشا: ابتدا BarcodeDetector بومی، در غیر این صورت ZXing ---- */
async function nativeDec(){
 if(!('BarcodeDetector' in window))return null;
 try{
  const sup=await BarcodeDetector.getSupportedFormats();
  const f=FMT.filter(x=>sup.indexOf(x)>=0);
  if(!f.length)return null;
  const bd=new BarcodeDetector({formats:f});
  return{name:'native',run:async src=>{
   const u=[],add=t=>{if(t&&u.indexOf(t)<0)u.push(t)};
   (await bd.detect(src)).forEach(x=>add(x.rawValue));
   const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;
   if(u.length<2&&w&&h){
    const cb=document.createElement('canvas'),cc=cb.getContext('2d');
    for(const f of [[0,.5],[.25,.75],[.5,1]]){
     try{const sy=h*f[0],sh=h*(f[1]-f[0]);cb.width=w;cb.height=Math.round(sh);cc.drawImage(src,0,sy,w,sh,0,0,w,cb.height);
      (await bd.detect(cb)).forEach(x=>add(x.rawValue))}catch(e){}
    }
   }
   return u}};
 }catch(e){return null}
}
function loadZX(){
 if(window.ZXing)return Promise.resolve();
 if(ZXp)return ZXp;
 ZXp=new Promise((ok,no)=>{
  let i=0;
  const tr=()=>{
   if(i>=ZXU.length){ZXp=null;return no(new Error('zxing'))}
   const sc=document.createElement('script');sc.src=ZXU[i++];sc.async=true;
   sc.onload=()=>window.ZXing?ok():tr();
   sc.onerror=()=>{sc.remove();tr()};
   document.head.appendChild(sc);
  };
  tr();
 });
 return ZXp;
}
async function zxDec(){
 await loadZX();
 const Z=window.ZXing,fm=ZXF.map(n=>Z.BarcodeFormat[n]).filter(x=>x!==undefined);
 const hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,fm);hints.set(Z.DecodeHintType.TRY_HARDER,true);
 const rd=new Z.MultiFormatReader(),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 const dec1=c=>{try{return rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))),hints)}catch(e){return null}};
 return{name:'zxing',run:async src=>{
  const w=src.videoWidth||src.naturalWidth||src.width,h=src.videoHeight||src.naturalHeight||src.height;
  if(!w||!h)return[];
  const mx=src.videoWidth?1280:1600,sc=Math.min(1,mx/Math.max(w,h)),W=Math.round(w*sc),H=Math.round(h*sc);
  cv.width=W;cv.height=H;cx.drawImage(src,0,0,W,H);
  const out=[],add=r=>{const t=r&&r.getText();if(!t||out.indexOf(t)>=0)return false;out.push(t);return true};
  /* چند بارکد در یک کادر: هر بارکدِ پیداشده پاک می‌شود و دوباره جست‌وجو می‌کنیم */
  for(let k=0;k<4;k++){
   const r=dec1(cv);if(!r||!add(r))break;
   const pts=(r.getResultPoints&&r.getResultPoints())||[];if(!pts.length)break;
   let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
   pts.forEach(q=>{x0=Math.min(x0,q.getX());x1=Math.max(x1,q.getX());y0=Math.min(y0,q.getY());y1=Math.max(y1,q.getY())});
   const px=(x1-x0)*.08+8,py=Math.max(H*.04,(x1-x0)*.1);
   cx.fillStyle='#fff';cx.fillRect(x0-px,y0-py,(x1-x0)+2*px,(y1-y0)+2*py);
  }
  /* اگر کمتر از دو کد پیدا شد، تصویر را نواری‌نوار هم بخوان */
  if(out.length<2){
   const cb=document.createElement('canvas'),cc=cb.getContext('2d',{willReadFrequently:true});
   for(const f of [[0,.5],[.25,.75],[.5,1]]){
    const sy=h*f[0],sh=h*(f[1]-f[0]);cb.width=W;cb.height=Math.round(sh*sc);cc.drawImage(src,0,sy,w,sh,0,0,cb.width,cb.height);
    add(dec1(cb));
   }
  }
  return out;
 }};
}
async function mkDec(){
 const n=await nativeDec();if(n)return n;
 try{return await zxDec()}catch(e){const er=new Error('zx');er.zx=1;throw er}
}

/* ---- دوربین ---- */
function stopStream(){
 if(!S)return;
 clearInterval(S.timer);S.timer=0;
 const st=S.stream;S.stream=null;
 if(st)st.getTracks().forEach(t=>{try{t.stop()}catch(e){}});
 const v=g('imsv');if(v){try{v.pause()}catch(e){}v.srcObject=null}
 S.torchOn=false;

function envErr(){
 const md=navigator.mediaDevices;
 if(md&&md.getUserMedia)return'';
 if(location.protocol==='http:'&&!/^(localhost|127\.|\[::1\])/.test(location.hostname))return'دسترسی به دوربین فقط در محیط امن (HTTPS یا localhost) ممکن است. صفحه را با آدرس https باز کنید.';
 return'این مرورگر از اسکن با دوربین پشتیبانی نمی‌کند. می‌توانید از «اسکن از روی عکس» استفاده کنید یا اطلاعات را دستی وارد کنید.';
}
function camErr(e){
 const n=(e&&e.name)||'';
 let t;
 if(n==='NotAllowedError'||n==='PermissionDeniedError'||n==='SecurityError')t='اجازهٔ دسترسی به دوربین داده نشده است. در تنظیمات مرورگر یا برنامه، مجوز «دوربین» را فعال کنید و دوباره تلاش کنید.';
 else if(n==='NotFoundError'||n==='DevicesNotFoundError')t='دوربینی روی این دستگاه پیدا نشد.';
 else if(n==='NotReadableError'||n==='TrackStartError'||n==='AbortError')t='دوربین در حال استفاده توسط برنامه دیگری است. آن برنامه را ببندید و دوباره تلاش کنید.';
 else t='دسترسی به دوربین امکان‌پذیر نیست'+(n?' ('+n+')':'')+'.';
 retryMsg(t);
}
function retryMsg(t){
 msg('err',esc(t)+'<br><small>می‌توانید «اسکن از روی عکس» را بزنید یا اطلاعات را دستی وارد کنید.</small><div class="r" style="margin-top:8px"><button type="button" class="b s" id="imsRe">🔄 تلاش مجدد</button><button type="button" class="b s g" id="imsMan">✍️ ورود دستی</button></div>',1);
 badge('دوربین فعال نیست',1);
 const r=g('imsRe'),m=g('imsMan');
 if(r)r.onclick=()=>start();
 if(m)m.onclick=()=>close();
}
async function start(devId){
 if(!S)return;
 const er=envErr();if(er){retryMsg(er);return}
 stopStream();
 const tok=++S.tok;
 S.phase='scan';
 const pb=g('imsP1');if(pb)pb.textContent='⏸ توقف اسکن';
 badge('در حال راه‌اندازی دوربین…',1);
 const vc={width:{ideal:1280},height:{ideal:720}};
 const useId=devId||CAM0;if(useId)vc.deviceId={exact:useId};else vc.facingMode={ideal:'environment'};
 let st;
 try{st=await navigator.mediaDevices.getUserMedia({audio:false,video:vc})}
 catch(e){
  if(!S||tok!==S.tok)return;
  if(useId&&(e.name==='OverconstrainedError'||e.name==='NotFoundError')){CAM0='';return start()}
  return camErr(e);
 }
 if(!S||tok!==S.tok||S.phase!=='scan'){st.getTracks().forEach(t=>t.stop());return}
 S.stream=st;
 const tr=st.getVideoTracks()[0],v=g('imsv');
 tr.addEventListener('ended',()=>{if(S&&tok===S.tok&&S.phase==='scan'){stopStream();retryMsg('ارتباط با دوربین قطع شد.')}});
 v.setAttribute('playsinline','');v.muted=true;v.srcObject=st;
 try{await v.play()}catch(e){}
 if(!S||tok!==S.tok)return;
 let caps={};try{caps=tr.getCapabilities?tr.getCapabilities():{}}catch(e){}
 if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0)tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
 g('imsT').style.display=caps.torch?'':'none';
 camList(tr);
 const d=S.decP;
 badge('در حال آماده‌سازی اسکنر…',1);
 try{S.dec=S.dec||await d}catch(e){
  if(!S||tok!==S.tok)return;
  stopStream();
  return retryMsg(e&&e.zx?'بارگذاری اسکنر جایگزین ممکن نشد. اتصال اینترنت را بررسی کنید.':'راه‌اندازی اسکنر ممکن نشد.');
 }
 if(!S||tok!==S.tok||S.phase!=='scan')return;
 badge('در حال اسکن…');
 if(!S.hint)msg('','برچسب اطلاعات روی جعبه (QR یا بارکد) را داخل کادر بگیرید. تا ثابت‌شدن تصویر کمی صبر کنید.');
 loop(tok);
}
async function camList(tr){
 /* فقط «camera 0» (دوربین اصلی پشت) استفاده می‌شود؛ انتخاب دوربین حذف شده است */
 try{
  const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  let cur='';try{cur=tr.getSettings().deviceId||''}catch(e){}
  const c0=ds.find(d=>/camera\s*0\b/i.test(d.label||'')&&!/front/i.test(d.label||''));
  if(c0){CAM0=c0.deviceId;if(S&&c0.deviceId!==cur&&!S.c0){S.c0=1;start(c0.deviceId)}}
 }catch(e){}
}
async function torch(){

 try{await tr.applyConstraints({advanced:[{torch:!S.torchOn}]});S.torchOn=!S.torchOn;g('imsT').textContent=S.torchOn?'🔦 خاموش کردن چراغ‌قوه':'🔦 چراغ‌قوه'}

function loop(tok){
 let busy=false;
 S.timer=setInterval(async()=>{
  if(busy||!S||tok!==S.tok||S.phase!=='scan'||document.hidden)return;
  const v=g('imsv');if(!v||v.readyState<2||!v.videoWidth)return;
  busy=true;
  try{
   const r=await S.dec.run(v);
   for(const x of r){if(!S||tok!==S.tok||S.phase!=='scan')break;onCode(x)}
  }catch(e){
   if(S&&tok===S.tok&&S.dec&&S.dec.name==='native'){
    try{badge('تعویض اسکنر…',1);S.dec=await zxDec();badge('در حال اسکن…')}
    catch(e2){stopStream();retryMsg('بارگذاری اسکنر جایگزین ممکن نشد. اتصال اینترنت را بررسی کنید.')}
   }
  }finally{busy=false}
 },S.dec&&S.dec.name==='native'?150:280);
}
function togglePause(){
 if(!S)return;

  S.phase='pause';stopStream();S.tok++;
  g('imsP1').textContent='▶️ ادامه اسکن';badge('اسکن متوقف شد؛ دوربین آزاد است',1);
  msg('','اسکن متوقف است و دوربین آزاد شده. برای ادامه، «ادامه اسکن» را بزنید.');

/* ---- پردازش نتیجه ---- */
function onCode(raw){
 const now=Date.now();
 if(raw===S.last&&now-S.lt<2500)return;
 S.last=raw;S.lt=now;
 /* اسکن جدید برای دستگاهی دیگر: اطلاعات و نتیجهٔ قبلی پاک شود */
 try{
  const pr=parse(raw),nv={imei1:pr.imei[0]&&pr.imei[0].v||'',imei2:pr.imei[1]&&pr.imei[1].v||'',sn:pr.sn||''};
  const a=scanDev(nv),b=scanDev(S.v);
  const has=S.v.imei1||S.v.imei2||S.v.sn,diff=a&&has&&a!==b;
  if(diff&&!ctx.ro1){S.v={imei1:'',imei2:'',sn:''};S.oth=[];const R0=g('imsR');if(R0)R0.innerHTML=''}
 }catch(e){}
 const r=handle(raw);
 msg(r.cls,r.t);
 chips();
 showRes(S.v);
 if(r.cls==='ok'){
  const f=g('imsf');if(f){f.classList.add('ok');setTimeout(()=>f.classList.remove('ok'),700)}
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  const m=S.mode;
  if(m!=='all'||(S.v.imei1&&S.v.imei2&&S.v.sn))setTimeout(()=>{if(S&&S.phase==='scan')finish(1)},350);
 }
}
function addImei(v,want){
 const f1=fval('imei1'),f2=fval('imei2');
 if(v===S.v.imei1||v===S.v.imei2)return{s:'dupS'};
 if(v===f1||v===f2)return{s:'dupF'};
 const t=taken(v);if(t)return{s:'taken',m:t};
 const free1=!S.v.imei1&&!f1&&!ctx.ro1,free2=!S.v.imei2&&!f2;
 let slot='';
 if(want===1){if(ctx.ro1)return{s:'ro'};slot='imei1'}
 else if(want===2)slot='imei2';
 else slot=free1?'imei1':free2?'imei2':(!S.v.imei1&&!ctx.ro1?'imei1':(!S.v.imei2?'imei2':''));
 if(!slot||S.v[slot])return{s:'full',slot};
 S.v[slot]=v;return{s:'ok',slot};
}
function addSn(v){
 const f=fval('sn');
 if(luhn15(v)||v===S.v.imei1||v===S.v.imei2||v===fval('imei1')||v===fval('imei2'))return{s:'imeiLike'};
 if(v===S.v.sn)return{s:'dupS'};
 if(v.toLowerCase()===f.toLowerCase())return{s:'dupF'};
 const t=taken(v);if(t)return{s:'taken',m:t};
 if(S.v.sn)return{s:'full'};
 S.v.sn=v;return{s:'ok'};
}
function handle(raw){
 const p=parse(raw),m=S.mode,msgs=[];let okc=0,warn='',err='';
 const impMsg=(r,v)=>{
  if(r.s==='ok'){okc++;msgs.push(FL[r.slot]+' شناسایی شد: '+v);return}
  if(r.s==='dupS')warn='این مقدار قبلاً در همین اسکن ثبت شده است.';
  else if(r.s==='dupF')warn='این مقدار هم‌اکنون در فرم وجود دارد (تکراری).';
  else if(r.s==='taken')err='IMEI تکراری است: '+r.m;
  else if(r.s==='ro')warn='در حالت ویرایش، IMEI ۱ قابل تغییر نیست.';
  else if(r.s==='full')warn='جای خالی برای این IMEI نیست؛ '+(r.slot?FL[r.slot]+' قبلاً مقدار دارد.':'هر دو IMEI تکمیل شده‌اند.');
 };
 const snMsg=(r,v)=>{
  if(r.s==='ok'){okc++;msgs.push('Serial Number شناسایی شد: '+v);return}
  if(r.s==='imeiLike')err='این مقدار یک IMEI است و به‌عنوان Serial ثبت نمی‌شود.';
  else if(r.s==='dupS')warn='این Serial قبلاً در همین اسکن ثبت شده است.';
  else if(r.s==='dupF')warn='این Serial هم‌اکنون در فرم وجود دارد.';
  else if(r.s==='taken')err='Serial تکراری است: '+r.m;
  else if(r.s==='full')warn='Serial قبلاً در این اسکن شناسایی شده است.';
 };
 if(m==='imei1'||m==='imei2'){
  const c=p.imei[0];
  if(c)impMsg(addImei(c.v,m==='imei1'?1:2),c.v);
 }else if(m==='sn'){
  const v=p.sn||p.token;
  if(v)snMsg(addSn(v),v);
 }else{
  p.imei.forEach(c=>impMsg(addImei(c.v,c.idx),c.v));
  if(p.sn)snMsg(addSn(p.sn),p.sn);
  p.oth.forEach(o=>{if(!S.oth.some(x=>x.v===o.v)&&S.oth.length<10)S.oth.push(o)});
 }
 if(okc)return{cls:'ok',t:'✅ '+msgs.join(' · ')+(err?' — '+err:'')};
 if(err)return{cls:'err',t:'⛔ '+err};
 if(warn)return{cls:'warn',t:'⚠️ '+warn};
 if(p.bad&&!p.imei.length)return{cls:'err',t:'⛔ بارکد خوانده شد اما IMEI معتبر نبود (شمارهٔ ۱۵ رقمی از نظر ساختاری صحیح نیست). دوباره اسکن کنید یا دستی وارد کنید.'};
 if(m==='sn')return{cls:'warn',t:'⚠️ کد خوانده شد اما Serial قابل‌استفاده‌ای در آن نبود.'};
 if(m==='imei1'||m==='imei2')return{cls:'warn',t:'⚠️ کد خوانده شد اما IMEI در آن پیدا نشد.'};
 if(p.oth.length)return{cls:'warn',t:'ℹ️ کد خوانده شد ولی IMEI یا Serial مشخصی نداشت؛ در پیش‌نمایش می‌توانید آن را به‌عنوان Serial انتخاب کنید.'};
 return{cls:'warn',t:'⚠️ کدی خوانده شد اما اطلاعات دستگاه در آن شناسایی نشد.'};
}
async function fromFile(f){
 if(!S)return;
 msg('','در حال تحلیل تصویر…');
 try{
  if(!S.dec)S.dec=await S.decP;
  const url=URL.createObjectURL(f),im=new Image();
  await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});
  let r=[];
  try{r=await S.dec.run(im)}catch(e){if(S.dec.name==='native'){S.dec=await zxDec();r=await S.dec.run(im)}}
  URL.revokeObjectURL(url);
  if(!r.length){msg('err','کدی در تصویر شناسایی نشد. عکس واضح‌تر و نزدیک‌تر بگیرید.');return}
  S.last='';r.forEach(x=>{const o=handle(x);msg(o.cls,o.t)});chips();
  if(S.v.imei1||S.v.imei2||S.v.sn||S.oth.length)finish(1);
 }catch(e){msg('err',e&&e.zx?'بارگذاری اسکنر جایگزین ممکن نشد. اتصال اینترنت را بررسی کنید.':'خواندن تصویر ممکن نشد.')}
}

/* ---- پیش‌نمایش و انتقال به فرم ---- */
const pvv=k=>{const e=g('imp_'+k);if(!e)return'';const v=e.value.trim();return k==='sn'?v:dg(v).replace(/\D/g,'')};
function vfy(k,v){
 if(!v)return{ok:true,empty:1};
 if(k==='sn'){
  if(!/^[A-Za-z0-9][A-Za-z0-9\-_.\/]{3,31}$/.test(v))return{ok:false,t:'Serial معتبر نیست (۴ تا ۳۲ حرف یا عدد لاتین).'};
  if(luhn15(v))return{ok:false,t:'این مقدار یک IMEI معتبر است، نه Serial.'};
  if(v===pvv('imei1')||v===pvv('imei2'))return{ok:false,t:'Serial نباید با IMEI یکی باشد.'};
  const t=taken(v);if(t)return{ok:false,t:'Serial تکراری است: '+t};
  return{ok:true};
 }
 if(!luhn15(v))return{ok:false,t:'IMEI معتبر نیست؛ باید ۱۵ رقم و از نظر ساختاری (Luhn) صحیح باشد.'};
 const o=k==='imei1'?'imei2':'imei1',ov=pvv(o)||fval(o);
 if(ov&&ov===v)return{ok:false,t:'IMEI ۱ و IMEI ۲ نباید یکی باشند.'};
 const t=taken(v);if(t)return{ok:false,t:'IMEI تکراری است: '+t};
 return{ok:true};
}
function refRow(k){
 const n=g('imn_'+k),rl=g('imrl_'+k),rc=g('imrc_'+k),v=pvv(k),cur=fval(k),r=vfy(k,v);
 if(!n)return r;
 rl.style.display='none';
 if(k==='imei1'&&ctx.ro1){n.className='imn';n.textContent='در حالت ویرایش، IMEI ۱ قابل تغییر نیست.';return{ok:true,empty:1,ro:1}}
 if(!r.ok){n.className='imn err';n.textContent='⛔ '+r.t;return r}
 if(!v){n.className='imn';n.textContent='مقداری اسکن نشده؛ فیلد فرم بدون تغییر می‌ماند.';return r}
 if(!cur){n.className='imn ok';n.textContent='✓ معتبر است؛ فیلد خالی بود و پس از تأیید پر می‌شود.'}
 else if(cur===v){n.className='imn ok';n.textContent='✓ همین مقدار هم‌اکنون در فرم است.'}
 else{n.className='imn';n.textContent='مقدار فعلی فرم: '+cur;rl.style.display='flex'}
 return r;
}
function showPreview(){
 stopStream();S.tok++;S.phase='prev';

 const oth=S.oth.length?`<div class="c" style="margin-top:6px"><b style="font-size:14px">سایر اطلاعات شناسایی‌شده</b><small style="display:block;color:var(--mu);margin:2px 0 4px">این موارد خودکار در فرم ثبت نمی‌شوند.</small>${S.oth.map((o,i)=>`<div class="imo"><div><small>${esc(o.k)}</small><br><span>${esc(o.v)}</span></div>${o.cand?`<button type="button" class="b s g" data-u="${i}">ثبت به‌عنوان Serial</button>`:''}</div>`).join('')}</div>`:'';
 P.innerHTML=`<div class="c">${row('imei1')}${row('imei2')}${row('sn')}</div>${oth}<small style="display:block;color:var(--mu);margin:0 0 8px">اگر مقداری اشتباه خوانده شده، همین‌جا اصلاحش کنید. هیچ اطلاعاتی بدون تأیید شما در فرم نوشته نمی‌شود و به جایی ارسال نمی‌شود.</small><div class="r"><button type="button" class="b" id="imsOk">✅ تأیید و انتقال به فرم</button><button type="button" class="b g" id="imsMore">📷 ادامه اسکن</button><button type="button" class="b g" id="imsNo">انصراف</button></div>`;
 ['imei1','imei2','sn'].forEach(k=>{const e=g('imp_'+k);e.addEventListener('input',()=>['imei1','imei2','sn'].forEach(refRow));refRow(k)});
 ['imei1','imei2','sn'].forEach(refRow);
 P.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const o=S.oth[+b.dataset.u];if(o){g('imp_sn').value=o.v;['imei1','imei2','sn'].forEach(refRow)}});
 const upRes=()=>showRes({imei1:pvv('imei1'),imei2:pvv('imei2'),sn:pvv('sn')});
 ['imei1','imei2','sn'].forEach(k=>g('imp_'+k).addEventListener('input',upRes));upRes();
 g('imsOk').onclick=apply;
 g('imsNo').onclick=()=>close();
 g('imsMore').onclick=()=>{
  ['imei1','imei2','sn'].forEach(k=>{const v=pvv(k);if(!(k==='imei1'&&ctx.ro1))S.v[k]=v});
  S.last='';S.hint=1;
  g('imsP').style.display='none';g('imsS').style.display='';g('imst').textContent='اسکن اطلاعات دستگاه';
  chips();msg('','اسکن بعدی را انجام دهید؛ اطلاعات قبلی حفظ شده است.');start();
 };
}
function finish(auto){
 if(!S)return;
 if(!(S.v.imei1||S.v.imei2||S.v.sn||S.oth.length)){toast('هنوز اطلاعاتی استخراج نشده است');return}

 if(auto===1)toast('✅ اطلاعات استخراج شد؛ پیش‌نمایش را بررسی و تأیید کنید',3500);
}
function apply(){
 const ks=['imei1','imei2','sn'];
 let bad=false;ks.forEach(k=>{const r=refRow(k);if(!r.ok)bad=true});
 if(bad){toast('ابتدا خطاهای مشخص‌شده را اصلاح کنید');return}
 if(!g('wf_imei1')){toast('فرم ثبت دستگاه بسته شده است؛ اسکن را دوباره از داخل فرم انجام دهید');close();return}
 const done=[],kept=[];
 ks.forEach(k=>{

function inject(id){

 const lab=i1.closest('label');

  d.querySelector('button').addEventListener('click',()=>open('all'));

 }
 [['imei1','imei1'],['imei2','imei2'],['sn','sn']].forEach(a=>{

  w.appendChild(b);
 });
}
