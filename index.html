let SC={t:[],done:false,ex:'',err:'',sci:false,deg:true,pan:''},SU={c:0,f:0,t:1,v:'',res:null},SCH=null;
const scIsNum=x=>typeof x=='string'&&/^[0-9.]/.test(x),
 scOpT=x=>x=='+'||x=='-'||x=='*'||x=='/'||x=='^',
 scOpn=x=>typeof x=='string'&&x.length>1&&x.endsWith('('),
 scPar=x=>x=='('||scOpn(x),
 scVal=x=>x!=null&&(scIsNum(x)||x==')'||x=='%'||x=='!'||x=='pi'||x=='e'),
 scSymT={'*':'×','/':'÷','-':'−','sqrt(':'√(','pi':'π'},
 scGrp=s=>{const m=String(s).split('.'),a=m[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');return a+(m.length>1?'.'+m[1]:'')},
 scTxt=t=>t.map(x=>scIsNum(x)?scGrp(x):(scSymT[x]||x)).join(''),

 scTok=s=>s[0]=='-'?['-',s.slice(1)]:[s],
 scClose=t=>{let o=0;t.forEach(x=>{if(scPar(x))o++;else if(x==')')o--});const r=t.slice();while(o-->0)r.push(')');return r},
 scStrip=t=>{const r=t.slice();while(r.length&&(scOpT(r[r.length-1])||scPar(r[r.length-1])))r.pop();return r},
 scTr=v=>Math.abs(v)<1e-12?0:v;
function scEval(tk){
 const t=scClose(tk);let p=0;const pk=()=>t[p];
 const rad=x=>SC.deg?x*Math.PI/180:x;
 const fn={'sqrt(':x=>{if(x<0)throw Error('f');return Math.sqrt(x)},'ln(':x=>{if(x<=0)throw Error('f');return Math.log(x)},'log(':x=>{if(x<=0)throw Error('f');return Math.log10(x)},
  'sin(':x=>scTr(Math.sin(rad(x))),'cos(':x=>scTr(Math.cos(rad(x))),'tan(':x=>{if(SC.deg&&Math.abs(x%180)==90)throw Error('f');return scTr(Math.tan(rad(x)))}};
 function atom(){const k=t[p++];
  if(scIsNum(k)){const v=parseFloat(k);if(isNaN(v))throw Error('s');return{v,raw:v}}
  if(k=='pi')return{v:Math.PI,raw:Math.PI};if(k=='e')return{v:Math.E,raw:Math.E};
  if(k=='('){const v=expr();if(t[p++]!=')')throw Error('s');return{v,raw:v}}

  throw Error('s')}
 function post(){let a=atom();for(;;){
  if(pk()=='!'){p++;const n=a.v;if(!(n>=0&&Number.isInteger(n)&&n<=170))throw Error('f');let r=1;for(let i=2;i<=n;i++)r*=i;a={v:r,raw:r}}
  else if(pk()=='%'){p++;a={v:a.v/100,raw:a.v,pct:true}}else break}return a}
 function un(){if(pk()=='-'){p++;const r=un();return{v:-r.v,raw:-r.raw,pct:r.pct}}if(pk()=='+'){p++;return un()}return post()}
 function pw(){const b=un();if(pk()=='^'){p++;const e=pw();return{v:Math.pow(b.v,e.v)}}return b}
 function term(){const f=pw();let v=f.v,single=true;const raw=f.raw,pct=f.pct;
  for(;;){const k=pk();
   if(k=='*'||k=='/'){p++;const g=pw();single=false;if(k=='/'){if(g.v==0)throw Error('÷0');v/=g.v}else v*=g.v}
   else if(k!=null&&(k=='('||scOpn(k)||k=='pi'||k=='e'||scIsNum(k))){const g=pw();single=false;v*=g.v}

 const v=expr();if(p<t.length)throw Error('s');if(!isFinite(v))throw Error('f');return v}

const scHL=()=>{if(SCH)return SCH;try{SCH=JSON.parse(localStorage.getItem('pm_calc_hist')||'[]')}catch(e){SCH=[]}if(!Array.isArray(SCH))SCH=[];return SCH},
 scHAdd=(e,r)=>{const h=scHL();h.unshift({e,r});if(h.length>50)h.length=50;try{localStorage.setItem('pm_calc_hist',JSON.stringify(h))}catch(_){}};

function scInfo(){

 if(SC.err){prev=SC.err;cls='ex er'}

 else{const st=scStrip(SC.t);if(st.length){if(plain(st))val=num(st);else{try{const r=scEval(st);val=r;prev=scGrp(scFix(r)).replace(/^-/,'−')}catch(e){}}}}
 const n=tx.length,fs=n<=7?1:n<=10?.82:n<=14?.64:n<=20?.5:.42;

function scBox(){const x=document.querySelector('.scx'),n=$('nav');if(!x||!n)return;const top=x.getBoundingClientRect().top+(window.scrollY||0),h=Math.floor(window.innerHeight-top-n.offsetHeight-12);x.style.height=Math.max(h,420)+'px'}
function scFit(){scBox();const v=$('sc_v');if(!v)return;let f=scInfo().fs;v.style.whiteSpace='nowrap';v.style.overflowY='visible';v.style.setProperty('--f',f);while(v.scrollWidth>v.clientWidth+1&&f>.3&&parseFloat(getComputedStyle(v).fontSize)>34){f-=.04;v.style.setProperty('--f',f)}if(v.scrollWidth>v.clientWidth+1){v.style.whiteSpace='normal';v.style.overflowY='auto';v.scrollTop=v.scrollHeight}}

function scUp(){const v=$('sc_v');if(!v)return;const I=scInfo();v.innerHTML=I.bigH;const e=$('sc_e');e.textContent=I.prev;e.className=I.cls;$('sc_w').textContent=I.words;scFit()}

function scKey(k){
 if(k=='C'){SC.t=[];SC.done=false;SC.ex='';SC.err='';return scUp()}
 SC.err='';
 if(SC.done){if(k=='=')return scUp();SC.done=false;SC.ex='';if(!(k.length==1&&'+-*/^%!B'.includes(k)))SC.t=[]}
 const T=SC.t,l=T[T.length-1];
 if(/^\d$/.test(k)){if(l&&scIsNum(l)){if(l.replace('.','').length<16)T[T.length-1]=l=='0'?k:l+k}else T.push(k)}
 else if(k=='.'){if(l&&scIsNum(l)){if(!l.includes('.'))T[T.length-1]=l+'.'}else T.push('0.')}
 else if(k.length==1&&'+-*/^'.includes(k)){
  if(l==null){if(k=='-')T.push('-')}
  else if(scOpT(l)){
   if(k=='-'&&(l=='*'||l=='/'||l=='^'))T.push('-');
   else if(l=='-'&&T.length>1&&scOpT(T[T.length-2])){T.pop();T[T.length-1]=k}
   else if(l=='-'&&(T.length==1||scPar(T[T.length-2]))){if(k!='-')T.pop()}
   else T[T.length-1]=k}
  else if(scPar(l)){if(k=='-')T.push('-')}
  else T.push(k)}
 else if(k=='%'){if(scVal(l)&&l!='%')T.push('%')}
 else if(k=='!'){if(scVal(l)&&l!='%'&&l!='!')T.push('!')}
 else if(k=='('){T.push('(')}
 else if(k==')'){let o=0;T.forEach(x=>{if(scPar(x))o++;else if(x==')')o--});if(o>0&&scVal(l))T.push(')')}
 else if(k=='P'){let o=0;T.forEach(x=>{if(scPar(x))o++;else if(x==')')o--});if(o>0&&scVal(l))T.push(')');else T.push('(')}
 else if(scOpn(k)||k=='pi'||k=='e'){T.push(k)}
 else if(k=='sq'){if(scVal(l)&&l!='%')T.push('^','2')}
 else if(k=='B'){if(l!=null){if(scIsNum(l)&&l.length>1)T[T.length-1]=l.slice(0,-1);else T.pop()}}
 else if(k=='='){
  const st=scStrip(T);
  if(st.length>1||(st.length==1&&!scIsNum(st[0]))){
   try{const cl=scClose(st),r=scEval(st),s=scFix(r),tx=scTxt(cl);SC.ex=tx+' =';SC.t=scTok(s);SC.done=true}
   catch(e){SC.err=e.message=='÷0'?'تقسیم بر صفر ممکن نیست':e.message=='f'?'عملیات نامعتبر':'فرمت نادرست'}}}
 scUp()}
function scKd(e){if(!$('sc_v'))return;const t=e.target&&e.target.tagName;if(t=='INPUT'||t=='TEXTAREA'||t=='SELECT')return;if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;let m=null;const pd='۰۱۲۳۴۵۶۷۸۹'.indexOf(k);
 if(/^[0-9]$/.test(k))m=k;else if(k.length==1&&pd>=0)m=String(pd);else if(k=='.'||k==','||k=='٫')m='.';else if(k.length==1&&'+-*/^'.includes(k))m=k;else if(k=='x'||k=='X')m='*';else if(k=='('||k==')')m=k;else if(k=='%')m='%';else if(k=='!')m='!';else if(k=='Enter'||k=='=')m='=';else if(k=='Backspace')m='B';else if(k=='Escape'||k=='Delete'||k=='c'||k=='C')m='C';

/* ---- Swipe: فقط کشیدن انگشت، بدون دکمه‌ی جهت ---- */
function bindSwipe(el){

 }
 function up(){act=false;id=null}

 }else{
  el.addEventListener('touchstart',function(e){if(e.target.closest&&e.target.closest('button'))return;var t=e.touches[0];down(t.clientX,t.clientY,0)},{passive:true});

 }

}
/* ---- D-Pad لمسی: فقط turn() را صدا می‌زند؛ منطق بازی دست‌نخورده ---- */

 });

}

<script id="hokm-js">
/* ===== بازی حکم ایرانی — افزوده‌شده به بخش سرگرمی ===== */
var HE=(function(){
'use strict';
/* خال‌ها: ۰ پیک ♠ ، ۱ دل ♥ ، ۲ خشت ♦ ، ۳ گشنیز ♣ — کارت: خال*۱۳ + (رتبه-۲) ، رتبه ۲..۱۴ (۱۴ = آس) */
var SN=['پیک','دل','خشت','گشنیز'],SY=['♠','♥','♦','♣'];
function su(c){return (c/13)|0}
function rk(c){return c%13+2}
function mk(s,r){return s*13+r-2}
function tm(s){return s&1}               /* صندلی ۰ و ۲ تیم ۰ ؛ صندلی ۱ و ۳ تیم ۱ */
function shuf(a,rng){for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mkDeck(rng){var d=[];for(var i=0;i<52;i++)d.push(i);return shuf(d,rng)}
function legal(h,lead){
 if(lead<0)return h.slice();
 var f=h.filter(function(c){return su(c)===lead});
 return f.length?f:h.slice();
}
function winnerOf(plays,trump){
 var best=plays[0];
 for(var i=1;i<plays.length;i++){
  var p=plays[i],ps=su(p.card),bs=su(best.card);
  if(ps===bs){if(rk(p.card)>rk(best.card))best=p}
  else if(ps===trump&&bs!==trump)best=p;
 }
 return best.seat;
}
function sortHand(h,trump){
 var col=function(s){return s===1||s===2?1:0};
 var rest=[0,1,3,2].filter(function(s){return s!==trump}),order=[],last=-1;
 if(trump>=0){order.push(trump);last=col(trump)}
 while(rest.length){
  var k=0;for(var i=0;i<rest.length;i++){if(last<0||col(rest[i])!==last){k=i;break}}
  var s=rest.splice(k,1)[0];order.push(s);last=col(s);
 }
 return h.slice().sort(function(a,b){
  var oa=order.indexOf(su(a)),ob=order.indexOf(su(b));
  return oa!==ob?oa-ob:rk(b)-rk(a);
 });
}

/* ---------------- هوش مصنوعی ---------------- */
function aiTrump(h,level,rng){
 var best=0,bs=-1e9;
 for(var s=0;s<4;s++){
  var cs=h.filter(function(c){return su(c)===s}),sc=cs.length*3,mx=0;
  cs.forEach(function(c){var r=rk(c);if(r>mx)mx=r;sc+=r===14?6:r===13?4:r===12?3:r===11?2:r===10?1:0});
  if(level==='easy'){sc=cs.length*3+mx/14+rng()*2.5}
  else{
   if(cs.length>=3)sc+=2;
   h.forEach(function(c){if(su(c)!==s&&rk(c)===14)sc+=1.5});
   if(level==='hard'&&cs.length===0)sc-=4;
  }
  if(sc>bs){bs=sc;best=s}
 }
 return best;
}

function aiPlay(v,rng){
 var hand=v.hand,n=v.trick.length,lead=n?su(v.trick[0].card):-1,lg=legal(hand,lead);
 if(lg.length===1)return lg[0];
 var lvl=v.level,hard=lvl==='hard';
 if(lvl==='easy'&&rng()<0.18)return lg[(rng()*lg.length)|0];
 var me=v.seat,par=(me+2)&3,tr=v.trump,last=n===3,o1=(me+1)&3,o2=(me+3)&3;
 var myHak=tm(me)===tm(v.hakem),inHand={},i,s;
 hand.forEach(function(c){inHand[c]=1});
 function higherUnseen(c){var s=su(c);for(var x=rk(c)+1;x<=14;x++){var id=mk(s,x);if(!v.played[id]&&!inHand[id])return true}return false}
 function isMaster(c){return hard?!higherUnseen(c):rk(c)===14}
 var unseenTr=0;
 for(var x=2;x<=14;x++){var id=mk(tr,x);if(!v.played[id]&&!inHand[id])unseenTr++}
 function oppVoid(s){return v.voids[o1][s]||v.voids[o2][s]}
 function ruffRisk(s){
  if(!hard||unseenTr===0)return false;
  return (v.voids[o1][s]&&!v.voids[o1][tr])||(v.voids[o2][s]&&!v.voids[o2][tr]);
 }
 function lowest(a){var b=a[0];for(var k=1;k<a.length;k++)if(rk(a[k])<rk(b))b=a[k];return b}
 function highest(a){var b=a[0];for(var k=1;k<a.length;k++)if(rk(a[k])>rk(b))b=a[k];return b}
 function bySuit(a,s){return a.filter(function(c){return su(c)===s})}
 function curBest(){
  var b=v.trick[0];
  for(var k=1;k<n;k++){var p=v.trick[k];
   if(su(p.card)===su(b.card)){if(rk(p.card)>rk(b.card))b=p}
   else if(su(p.card)===tr&&su(b.card)!==tr)b=p;
  }
  return b;
 }

 /* ---- شروع دست ---- */
 if(n===0){
  var trs=bySuit(lg,tr),nts=lg.filter(function(c){return su(c)!==tr});
  if(!nts.length){
   var m0=trs.filter(isMaster);
   return m0.length?highest(m0):(myHak?highest(trs):lowest(trs));
  }
  var cand=[];
  for(s=0;s<4;s++){
   if(s===tr)continue;
   var cs=bySuit(nts,s);if(!cs.length)continue;
   var hh=highest(cs);
   if(isMaster(hh)&&!ruffRisk(s))cand.push({c:hh,len:cs.length});
  }
  if(cand.length){cand.sort(function(a,b){return b.len-a.len||rk(b.c)-rk(a.c)});return cand[0].c}
  if(trs.length&&myHak&&unseenTr>0){
   var tmst=trs.filter(isMaster);
   if(tmst.length)return highest(tmst);
   if(hard&&trs.length>=5)return highest(trs);
   if(!hard&&trs.length>=4&&rng()<0.6)return highest(trs);
  }
  if(hard&&unseenTr>0&&!v.voids[par][tr]){
   for(s=0;s<4;s++){
    if(s===tr)continue;
    if(v.voids[par][s]&&!oppVoid(s)){var pc=bySuit(nts,s);if(pc.length)return lowest(pc)}
   }
  }
  var best=null,bsc=-1e9;
  for(s=0;s<4;s++){
   if(s===tr)continue;
   var c2=bySuit(nts,s);if(!c2.length)continue;
   var sc=c2.length*2-(ruffRisk(s)?6:0)+(hard&&v.voids[par][s]&&!v.voids[par][tr]?3:0);
   if(rk(highest(c2))>=13&&c2.length===1)sc-=1;
   if(sc>bsc){bsc=sc;best=c2}
  }
  return lowest(best);
 }

 /* ---- ادامه دست ---- */
 var cur=curBest(),curS=su(cur.card),partnerWin=cur.seat===par;
 var follow=bySuit(hand,lead).length>0;
 if(follow){
  var same=lg;
  if(partnerWin){
   if(last)return lowest(same);
   var pcd=cur.card;
   if(su(pcd)===lead&&(isMaster(pcd)||(!hard&&rk(pcd)>=13)))return lowest(same);
   if(su(pcd)===tr&&lead!==tr)return lowest(same);
   if(hard){var mm=same.filter(isMaster);if(mm.length)return lowest(mm)}
   return lowest(same);
  }
  if(curS!==lead)return lowest(same);               /* حریف برش زده؛ نمی‌شود برد */
  var win=same.filter(function(c){return rk(c)>rk(cur.card)});
  if(!win.length)return lowest(same);
  if(last)return lowest(win);
  if(hard){
   var mw=win.filter(isMaster);if(mw.length)return lowest(mw);
   var danger=false;
   for(var k=1;k<=3-n;k++){var sd=(me+k)&3;if(tm(sd)!==tm(me)&&v.voids[sd][lead]&&!v.voids[sd][tr]&&unseenTr>0)danger=true}
   if(danger)return lowest(same);
   return lowest(win);
  }
  var lw=lowest(win);
  if(rk(lw)<11&&rng()<0.45)return lowest(same);
  return lw;
 }

 /* ---- خال دست را ندارد ---- */
 var trs2=bySuit(hand,tr);
 function discard(){
  var nt=hand.filter(function(c){return su(c)!==tr});
  if(!nt.length)return lowest(hand);
  var bs=null,bsc=1e9;
  for(var q=0;q<4;q++){
   if(q===tr)continue;
   var cs=bySuit(nt,q);if(!cs.length)continue;
   var sc=rk(highest(cs))*10-cs.length;
   if(sc<bsc){bsc=sc;bs=cs}
  }
  return lowest(bs);
 }
 if(partnerWin)return discard();
 if(trs2.length){
  if(curS===tr){
   var hi=trs2.filter(function(c){return rk(c)>rk(cur.card)});
   if(hi.length)return lowest(hi);
   return discard();
  }
  return lowest(trs2);
 }
 return discard();
}

/* ---------------- منطق بازی ---------------- */
function Game(o){
 o=o||{};this.level=o.level||'medium';this.target=o.target||7;this.rng=o.rng||Math.random;this.reset();
}
Game.prototype.reset=function(){
 this.score=[0,0];this.rounds=[0,0];this.hakem=-1;this.phase='idle';this.roundNo=0;
 this.hands=[[],[],[],[]];this.trump=-1;this.tricks=[0,0];this.trick=[];this.turn=0;
 this.played=[];this.voids=[];this.over=false;this.rest=[];this.lastTrick=null;
};
Game.prototype.pickHakem=function(mode){
 if(mode==='me'){this.hakem=0;return {seat:0,seq:[],start:0}}
 var d=mkDeck(this.rng),start=Math.floor(this.rng()*4),seq=[];
 for(var i=0;i<52;i++){
  var seat=(start+i)%4;seq.push({seat:seat,card:d[i]});
  if(rk(d[i])===14){this.hakem=seat;break}
 }
 return {seat:this.hakem,seq:seq,start:start};
};
Game.prototype.startRound=function(){
 var d=mkDeck(this.rng),i;
 this.roundNo++;this.hands=[[],[],[],[]];
 this.hands[this.hakem]=d.slice(0,5);this.rest=d.slice(5);
 this.trump=-1;this.tricks=[0,0];this.trick=[];this.lastTrick=null;this.phase='trump';
 this.played=[];for(i=0;i<52;i++)this.played.push(false);
 this.voids=[];for(i=0;i<4;i++)this.voids.push([false,false,false,false]);
 this.hands[this.hakem]=sortHand(this.hands[this.hakem],-1);
};
Game.prototype.setTrump=function(suit){
 if(this.phase!=='trump')return false;
 this.trump=suit;
 var need=[13,13,13,13],idx=0;need[this.hakem]=8;
 for(var k=0;k<4;k++){
  var s=(this.hakem+k)%4;
  for(var n=0;n<need[s];n++)this.hands[s].push(this.rest[idx++]);
 }
 this.rest=[];
 for(var q=0;q<4;q++)this.hands[q]=sortHand(this.hands[q],suit);
 this.phase='play';this.turn=this.hakem;
 return true;
};
Game.prototype.leadSuit=function(){return this.trick.length?su(this.trick[0].card):-1};
Game.prototype.legalFor=function(seat){return legal(this.hands[seat],this.leadSuit())};
Game.prototype.play=function(seat,card){
 if(this.phase!=='play')return {error:'phase'};
 if(seat!==this.turn)return {error:'turn'};
 var h=this.hands[seat],i=h.indexOf(card);
 if(i<0)return {error:'own'};
 var lead=this.leadSuit();
 if(legal(h,lead).indexOf(card)<0)return {error:'suit'};
 h.splice(i,1);
 if(lead>=0&&su(card)!==lead)this.voids[seat][lead]=true;
 this.played[card]=true;this.trick.push({seat:seat,card:card});
 if(this.trick.length<4){this.turn=(seat+1)&3;return {type:'card',seat:seat,card:card,next:this.turn}}
 var w=winnerOf(this.trick,this.trump),t=tm(w);
 this.tricks[t]++;var plays=this.trick;this.trick=[];this.turn=w;this.lastTrick={plays:plays,winner:w};
 var ev={type:'trick',seat:seat,card:card,winner:w,team:t,plays:plays,tricks:this.tricks.slice(),round:null,kotWatch:false};
 var a=this.tricks[0],b=this.tricks[1],wt=a>=7?0:(b>=7?1:-1);
 if(wt<0)return ev;
 var lt=1-wt,lost=this.tricks[lt];
 if(lost===0&&a+b<13){ev.kotWatch=true;return ev}   /* هنوز احتمال کوت هست؛ دست‌ها ادامه دارد */
 var ht=tm(this.hakem),kot=lost===0,pts=1,kind='normal';
 if(kot){if(wt===ht){pts=2;kind='kot'}else{pts=3;kind='hakemkot'}}
 this.score[wt]+=pts;this.rounds[wt]++;
 var prev=this.hakem,nh=wt===ht?this.hakem:(this.hakem+1)&3;
 this.hakem=nh;
 var over=this.score[wt]>=this.target;
 this.over=over;this.phase=over?'over':'roundEnd';
 ev.round={team:wt,tricks:this.tricks.slice(),points:pts,kind:kind,prevHakem:prev,hakem:nh,hakemChanged:nh!==prev,
  over:over,score:this.score.slice(),rounds:this.rounds.slice()};

};
Game.prototype.view=function(seat){
 return {seat:seat,level:this.level,hand:this.hands[seat].slice(),trump:this.trump,hakem:this.hakem,
  trick:this.trick.map(function(p){return {seat:p.seat,card:p.card}}),played:this.played.slice(),
  voids:this.voids.map(function(a){return a.slice()}),tricks:this.tricks.slice(),
  counts:this.hands.map(function(h){return h.length})};
};
Game.prototype.aiChoose=function(seat){return aiPlay(this.view(seat),this.rng)};
Game.prototype.aiTrump=function(){return aiTrump(this.hands[this.hakem],this.level,this.rng)};

return {Game:Game,legal:legal,winnerOf:winnerOf,aiPlay:aiPlay,aiTrump:aiTrump,su:su,rk:rk,mk:mk,tm:tm,SN:SN,SY:SY,sortHand:sortHand,mkDeck:mkDeck};
})();

/* ===== رابط بازی حکم ایرانی ===== */
(function(){
'use strict';
var pd=function(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
function lg(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var Su=HE.su,Rk=HE.rk,SN=HE.SN,SY=HE.SY.map(function(x){return x+'\uFE0E'});
var RL={14:'آس',13:'شاه',12:'بی‌بی',11:'سرباز'};
function rl(r){return RL[r]||pd(r)}
function isRed(c){var s=Su(c);return s===1||s===2}
var NAMES=['شما','بهرام','مهسا','کامران'],AV=['😎','🧔','👩','🧑'],POS=['b','r','t','l'];
var LV={easy:'آسان',medium:'متوسط',hard:'سخت'};

/* ---------- تنظیمات و آمار ---------- */
var cfg={level:'medium',target:7,hakem:'draw',snd:true};
try{var sv=JSON.parse(lg('pm_hokm_cfg','null'));if(sv&&typeof sv==='object'){for(var k in cfg)if(k in sv)cfg[k]=sv[k]}}catch(e){}
if(!LV[cfg.level])cfg.level='medium';
if([3,5,7,11].indexOf(cfg.target)<0)cfg.target=7;
if(cfg.hakem!=='me')cfg.hakem='draw';
cfg.snd=cfg.snd!==false;
var stats={w:0,l:0};
try{var ss=JSON.parse(lg('pm_hokm_stats','null'));if(ss){stats.w=+ss.w||0;stats.l=+ss.l||0}}catch(e){}
function saveCfg(){ls('pm_hokm_cfg',JSON.stringify(cfg))}

/* ---------- صدا (بدون فایل خارجی) ---------- */
var AC=null;
function ac(){
 if(!cfg.snd)return null;
 try{
  if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C()}
  if(AC.state==='suspended')AC.resume();return AC;
 }catch(e){return null}
}
function tone(f,d,type,vol,when,f2){
 var a=ac();if(!a)return;
 try{
  var o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
 }catch(e){}
}

function relayout(){
 if(!R||!alive())return;
 var W=R.clientWidth,H=R.clientHeight,iw=W-20;
 ROWS2=H>=500;
 if(ROWS2)CW=Math.max(40,Math.min(72,Math.floor(iw/(1+6*.62)),Math.floor(H*.25/(1.42*1.46))));
 else CW=Math.max(34,Math.min(54,Math.floor(H*.19)));
 var ch=Math.round(CW*1.42);
 HH.style.height=(ROWS2?Math.round(ch*1.46):ch)+4+'px';
 BW=Math.max(20,Math.min(30,Math.floor(Math.min(W*.075,H*.045))));
 R.style.setProperty('--cw',CW+'px');R.style.setProperty('--bw',BW+'px');
 var p2=R.querySelector('.p2'),p1=R.querySelector('.p1'),p3=R.querySelector('.p3');
 var st=p2.offsetTop+p2.offsetHeight+6,sl=Math.max(p1.offsetWidth,p3.offsetWidth)+14;
 R.style.setProperty('--st',st+'px');R.style.setProperty('--sl',sl+'px');
 var cw=CT.clientWidth,chh=CT.clientHeight;
 TCW=Math.max(38,Math.min(62,Math.floor(Math.min(cw*.29,chh*.31))));
 R.style.setProperty('--tcw',TCW+'px');
 R.style.setProperty('--md',Math.max(80,Math.floor(Math.min(cw,chh)*.86))+'px');
 if(G&&G.phase==='play'||G&&G.phase==='trump')renderHand(false);
}

/* ---------- نمایش ---------- */
function status(t,cls){ST.textContent=t;ST.className='hkst'+(cls?' '+cls:'')}
function chips(){
 for(var s=0;s<4;s++){
  var hk=G&&G.hakem===s,isP=s===2;
  CH[s].innerHTML='<span class="av">'+AV[s]+'</span><span>'+NAMES[s]+'</span>'+(isP?'<em>یار</em>':'')+(hk?'<span class="cr">👑</span>':'');
 }
}
function setActive(seat){
 for(var s=0;s<4;s++){
  var on=s===seat;
  if(s===0)CH[0].classList.toggle('act',on);else CH[s].parentNode.classList.toggle('act',on);
 }
}
function hud(){
 var el=R.querySelector('#hkhud'),g=G||{score:[0,0],rounds:[0,0],tricks:[0,0],trump:-1,hakem:-1,target:cfg.target};
 function team(t,cls,title,sub){
  var pips='';for(var i=0;i<7;i++)pips+='<i'+(g.tricks[t]>i?' class="on"':'')+'></i>';
  return '<div class="hkm-t '+cls+'"><small>'+title+'</small><div class="pt">'+pd(g.score[t])+'<span>از '+pd(g.target)+'</span></div>'
   +'<div class="pp">'+pips+'</div><small>دست: '+pd(g.tricks[t])+' · دور برده: '+pd(g.rounds[t])+'</small></div>';
 }
 var tr=g.trump,mid='<div class="hkm-m"><small>خال حکم</small>'
  +(tr>=0?'<div class="ts'+(tr===1||tr===2?' red':'')+'">'+SY[tr]+'</div><span>'+SN[tr]+'</span>':'<div class="ts">؟</div><span>—</span>')
  +'</div>';
 el.innerHTML=team(0,'a','تیم شما','')+mid+team(1,'b','تیم حریف','');
 var b=R.querySelector('#hksnd');if(b)b.textContent=cfg.snd?'🔊':'🔇';
}
function setBacks(seat,n,pop){
 var c=BK[seat];if(!c)return;
 while(c.children.length>n)c.removeChild(c.lastChild);
 var add=0;
 while(c.children.length<n){var d=document.createElement('div');d.className='bk'+(pop?' nw':'');if(pop)d.style.animationDelay=(add++*35)+'ms';c.appendChild(d)}
}
function clearTable(){
 Object.keys(handEls).forEach(function(k){if(handEls[k].parentNode)handEls[k].parentNode.removeChild(handEls[k])});
 handEls={};
 SL.forEach(function(s){s.innerHTML=''});
 for(var s=1;s<4;s++)setBacks(s,0);
 humanTurn=false;
}

/* ---------- دست بازیکن انسانی ---------- */
function renderHand(deal){
 if(!G)return;
 var hand=G.hands[0],n=hand.length,iw=R.clientWidth-20,cw=CW,ch=Math.round(cw*1.42);
 var two=ROWS2&&n>5,r1=two?Math.ceil(n/2):n,r2=n-r1;
 hand.forEach(function(c,i){
  var el=handEls[c];
  if(!el){el=cardEl(c,cw);handEls[c]=el;HH.appendChild(el);if(deal){el.classList.add('dl');el.style.animationDelay=(i*30)+'ms'}}
  else{el.style.setProperty('--w',cw+'px');el.classList.toggle('tp',G.trump===Su(c))}
  var row=i<r1?0:1,idx=row?i-r1:i,m=row?r2:r1;
  var step=Math.min(cw*(ROWS2?.72:.66),(iw-cw)/Math.max(1,m-1));
  var rowW=cw+(m-1)*step,x=(iw-rowW)/2+(m-1-idx)*step;
  var y=two?(row?Math.round(ch*.46):0):(ROWS2?Math.round(ch*.23):0);
  el.style.left=Math.round(x)+'px';el.style.top=y+'px';el.style.zIndex=row*30+(m-idx);
 });
 markLegal();
}
function markLegal(){
 if(!G)return;
 var on=humanTurn&&G.phase==='play'&&G.turn===0,lgl=on?G.legalFor(0):null;
 G.hands[0].forEach(function(c){
  var el=handEls[c];if(el)el.classList.toggle('dim',!!(on&&lgl.indexOf(c)<0));
 });
}

/* ---------- جریان بازی ---------- */
function newGame(){
 gen++;block=0;blocking=false;
 G=new HE.Game({level:cfg.level,target:cfg.target});
 kotShown=false;
 ovHide();clearTable();chips();setActive(-1);hud();
 relayout();
 var dr=G.pickHakem(cfg.hakem);
 if(!dr.seq.length){
  chips();hud();status('شما حاکم اول هستید 👑');snd('win');
  after(1100,beginRound);return;
 }
 status('تعیین حاکم: ورق پخش می‌شود تا اولین آس…');
 var cnt=[0,0,0,0],step=150;
 dr.seq.forEach(function(p,i){
  after(250+i*step,function(){
   var el=cardEl(p.card,TCW);el.classList.add('tc','pop');
   el.style.setProperty('--rot',(Math.random()*8-4).toFixed(1)+'deg');
   var k=cnt[p.seat]++,off=p.seat===1||p.seat===3?[0,(k%4)*10-15]:[(k%4)*14-21,0];
   el.style.marginLeft='calc(var(--w)*-.5 + '+off[0]+'px)';el.style.marginTop='calc(var(--w)*-.71 + '+off[1]+'px)';
   el.style.zIndex=k+1;SL[p.seat].appendChild(el);snd('card');
   var kids=SL[p.seat].children;if(kids.length>4)SL[p.seat].removeChild(kids[0]);
   setActive(p.seat);
   if(i===dr.seq.length-1){
    el.classList.add('wn');
    after(500,function(){
     chips();hud();setActive(dr.seat);snd('win');
     status('«'+NAMES[dr.seat]+'» حاکم شد 👑');
     after(1300,function(){SL.forEach(function(s){s.innerHTML=''});beginRound()});
    });
   }
  });
 });
}

function beginRound(){
 if(!alive()||!G)return;
 SL.forEach(function(s){s.innerHTML=''});
 clearTable();kotShown=false;
 G.startRound();
 chips();hud();setActive(G.hakem);relayout();
 var h=G.hakem;
 if(h===0){
  status('شما حاکم هستید؛ خال حکم را انتخاب کنید');
  snd('deal');
  var tr='';
  for(var s=0;s<4;s++){
   var cnt=G.hands[0].filter(function(c){return Su(c)===s}).length;
   tr+='<button class="'+(s===1||s===2?'r':'')+'" data-a="trump" data-v="'+s+'"><i>'+SY[s]+'</i><b>'+SN[s]+'</b><small>'+pd(cnt)+' کارت</small></button>';
  }
  ovSet('<div class="hkpn"><h3>خال حکم را انتخاب کن 👑</h3><p class="sub">این ۵ کارت اول توست؛ بقیهٔ کارت‌ها بعد از انتخاب حکم پخش می‌شود.</p>'
   +'<div class="hktr" id="hktr"></div><div class="hkts">'+tr+'</div></div>',true,true);
  var box=OV.querySelector('#hktr');
  G.hands[0].forEach(function(c,i){var el=cardEl(c,Math.min(58,Math.floor((R.clientWidth-80)/4.4)));box.appendChild(el)});
  for(var q=1;q<4;q++)setBacks(q,0);
  HH.innerHTML='';handEls={};
 }else{
  setBacks(h,5,true);
  status('«'+NAMES[h]+'» در حال انتخاب خال حکم است…');
  after(1100,function(){
   var t=G.aiTrump();dealAfterTrump(t,true);
  });
 }
}

function dealAfterTrump(t,byAi){
 G.setTrump(t);
 chips();hud();
 status(byAi?('«'+NAMES[G.hakem]+'» ' +SN[t]+' '+SY[t]+' را حکم کرد'):('حکم: '+SN[t]+' '+SY[t]));
 for(var s=1;s<4;s++)setBacks(s,13,true);
 for(var c in handEls){if(handEls[c].parentNode)handEls[c].parentNode.removeChild(handEls[c])}
 handEls={};HH.innerHTML='';
 renderHand(true);snd('deal');
 after(1000,next);
}

function next(){
 if(!alive()||!G||G.phase!=='play')return;
 var s=G.turn;setActive(s);
 if(s===0){
  humanTurn=true;markLegal();
  var ls2=G.leadSuit();
  status(ls2>=0?('نوبت شماست — خال دست: '+SN[ls2]+' '+SY[ls2]):'نوبت شماست — شما دست را شروع کنید','me');
 }else{
  humanTurn=false;markLegal();
  status('«'+NAMES[s]+'» در حال بازی…');
  after(380+Math.floor(Math.random()*240),function(){
   var c=G.aiChoose(s);doPlay(s,c);
  });
 }
}

function humanPlay(c,el){
 if(!G||!humanTurn||G.phase!=='play'||G.turn!==0)return;
 var lgl=G.legalFor(0);
 if(lgl.indexOf(c)<0){
  var ls2=G.leadSuit();
  if(el){el.classList.remove('sk');void el.offsetWidth;el.classList.add('sk')}
  snd('err');status('باید هم‌خال دست بازی کنید: '+SN[ls2]+' '+SY[ls2],'warn');
  return;
 }
 humanTurn=false;doPlay(0,c);
}

function doPlay(seat,card){
 var src,ev;
 if(seat===0){var he=handEls[card];src=he?he.getBoundingClientRect():R.querySelector('.hkhand').getBoundingClientRect()}
 else{
  var kids=BK[seat].children;
  src=(kids.length?kids[kids.length-1]:CH[seat]).getBoundingClientRect();
 }
 ev=G.play(seat,card);
 if(ev.error){status('خطا در نوبت‌بندی؛ دوباره تلاش می‌شود');humanTurn=false;after(300,next);return}
 if(seat===0){var h2=handEls[card];if(h2&&h2.parentNode)h2.parentNode.removeChild(h2);delete handEls[card];renderHand(false)}
 else setBacks(seat,G.hands[seat].length);
 flyIn(seat,card,src);snd('card');
 setActive(-1);
 after(340,function(){
  if(ev.type==='card'){next();return}
  afterTrick(ev);
 });
}

function flyIn(seat,card,src){
 var slot=SL[seat],el=cardEl(card,TCW);
 el.classList.add('tc');el.style.setProperty('--rot',(Math.random()*10-5).toFixed(1)+'deg');
 el.style.zIndex=slot.children.length+1;
 slot.appendChild(el);
 var f=el.getBoundingClientRect();
 var dx=(src.left+src.width/2)-(f.left+f.width/2),dy=(src.top+src.height/2)-(f.top+f.height/2),sc=Math.max(.3,src.width/f.width);
 el.style.transition='none';el.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
 void el.offsetWidth;
 el.style.transition='transform .3s cubic-bezier(.22,.9,.3,1)';
 el.style.transform='rotate(var(--rot,0deg))';
 return el;
}

function afterTrick(ev){
 var w=ev.winner,wc=SL[w].lastChild;
 if(wc)wc.classList.add('wn');
 hud();setActive(w);
 status('«'+NAMES[w]+'» دست را برد'+(ev.team===0?' ✅':''),ev.team===0?'me':'');
 snd(ev.team===0?'trick':'lose');
 if(ev.kotWatch&&!kotShown){kotShown=true;status('۷ دست کامل شد؛ تا امکان کوت هست بازی ادامه دارد','me')}
 after(750,function(){
  var t=CH[w].getBoundingClientRect(),tx=t.left+t.width/2,ty=t.top+t.height/2;
  SL.forEach(function(sl){
   var e=sl.firstChild;if(!e)return;
   var f=e.getBoundingClientRect();
   e.style.transition='transform .36s ease-in,opacity .36s ease-in';
   e.style.transform='translate('+(tx-(f.left+f.width/2))+'px,'+(ty-(f.top+f.height/2))+'px) scale(.35)';e.style.opacity='0';
  });
  after(380,function(){
   SL.forEach(function(sl){sl.innerHTML=''});
   if(ev.round){after(200,function(){endRound(ev.round)});return}
   next();
  });
 });
}

/* ---------- پایان دور / بازی ---------- */

 if(rd.over){

   +'<div class="stt">امتیاز نهایی بازی: '+pd(G.target)+' · سطح: '+LV[cfg.level]+'</div>'
   +'<button class="hkbt" data-a="again">↻ شروع مجدد</button><button class="hkbt g" data-a="menu">تنظیمات بازی</button><button class="hkbt g" data-a="exit">خروج</button></div>',true,true);
  return;
 }
 snd(me?'win':'end');
 var nh=rd.hakemChanged?('حاکم دور بعد: «'+NAMES[rd.hakem]+'» 👑'):('«'+NAMES[rd.hakem]+'» همچنان حاکم است 👑');
 ovSet('<div class="hkpn"><div class="big">'+(me?'🎉':'😔')+'</div><h3>'+(me?'تیم شما این دور را برد':'تیم حریف این دور را برد')+'</h3>'
  +'<p class="sub">دست‌ها: '+pd(rd.tricks[0])+' به '+pd(rd.tricks[1])+'</p>'
  +'<div class="kt">'+(rd.kind==='normal'?'+۱ امتیاز':'🔥 '+kl)+'</div>'+info
  +'<p>'+nh+'</p><button class="hkbt" data-a="nextround">▶ دور بعد</button></div>',true,true);
}

  +'<div class="row"><label>صدا</label>'+seg('sndset',[[1,'🔊 روشن'],[0,'🔇 خاموش']],cfg.snd?1:0)+'</div>'
  +'<button class="hkbt" data-a="start">▶ شروع بازی</button><button class="hkbt g" data-a="help">📖 راهنمای قوانین</button><button class="hkbt g" data-a="exit">خروج</button>'
  +'<div class="stt">بردها: '+pd(stats.w)+' · باخت‌ها: '+pd(stats.l)+'</div></div>',true);
}
function showCfg(){
 back2=showCfg;
 ovSet('<div class="hkpn"><h3>⚙ تنظیمات</h3><p class="sub">تغییر سطح از دست بعدی اعمال می‌شود.</p>'
  +'<div class="row"><label>سطح هوش مصنوعی</label>'+seg('level',[['easy','آسان'],['medium','متوسط'],['hard','سخت']],cfg.level)+'</div>'
  +'<div class="row"><label>صدا</label>'+seg('sndset',[[1,'🔊 روشن'],[0,'🔇 خاموش']],cfg.snd?1:0)+'</div>'
  +'<button class="hkbt" data-a="resume">▶ ادامه بازی</button><button class="hkbt g" data-a="help">📖 راهنمای قوانین</button>'
  +'<button class="hkbt g" data-a="menu">بازی جدید با تنظیمات دیگر</button></div>',true);
}
function showHelp(){
 ovSet('<div class="hkpn"><h3>📖 راهنمای حکم</h3><div class="hkgd">'
 +'<h4>🎯 هدف</h4><p>هر تیم باید ۷ دست از ۱۳ دست هر دور را ببرد. برندهٔ دست‌ها، دور را می‌برد و امتیاز می‌گیرد. تیمی که زودتر به امتیاز نهایی برسد برندهٔ بازی است.</p>'
 +'<h4>👥 بازیکنان</h4><p>شما (پایین) و مهسا (روبه‌رو) هم‌تیمی هستید؛ بهرام و کامران حریف‌اند. بازی خلاف جهت عقربه‌های ساعت می‌چرخد.</p>'
 +'<h4>🃏 کارت‌ها</h4><p>۵۲ کارت با چهار خال: دل ♥ ، خشت ♦ ، پیک ♠ ، گشنیز ♣. هر نفر ۱۳ کارت می‌گیرد. ارزش کارت‌ها از بزرگ به کوچک:</p>'
 +'<div class="rk"><span class="g">آس</span><span class="g">شاه</span><span class="g">بی‌بی</span><span class="g">سرباز</span><span>۱۰</span><span>۹</span><span>۸</span><span>۷</span><span>۶</span><span>۵</span><span>۴</span><span>۳</span><span>۲</span></div>'
 +'<h4>👑 حاکم و حکم</h4><p>در دور اول به هر بازیکن به‌نوبت یک کارت رو می‌شود تا اولین آس؛ صاحب آس حاکم است (یا در تنظیمات خودتان حاکم شوید). حاکم ۵ کارت اول را می‌بیند و یک خال را «حکم» اعلام می‌کند؛ سپس بقیهٔ کارت‌ها پخش می‌شود. حکم، خال برتر دور است.</p>'
 +'<h4>▶ طرز بازی</h4><p>حاکم دست اول را شروع می‌کند و هر بازیکن یک کارت می‌گذارد. باید هم‌خال کارت اول بازی کنید. اگر آن خال را ندارید، هر کارتی می‌توانید بگذارید؛ گذاشتن حکم به این کار «بریدن» می‌گویند.</p>'
 +'<h4>🏆 برندهٔ هر دست</h4><p>اگر در دست حکم آمده باشد، بالاترین حکم می‌برد؛ در غیر این صورت بالاترین کارت هم‌خال کارت اول. برندهٔ دست، دست بعدی را شروع می‌کند.</p>'
 +'<h4>📊 امتیاز</h4><div class="sc"><b>۱</b><span>بردن دور (۷ دست یا بیشتر)</span><b>۲</b><span>کوت: حریف هیچ دستی نبرده (۱۳ به ۰)</span><b>۳</b><span>حاکم‌کوت: تیم حاکم کوت شود</span></div>'
 +'<p>اگر تیمی ۷ دست ببرد و حریف هنوز دستی نبرده باشد، بازی برای کوت ادامه می‌یابد؛ با اولین دست حریف، دور تمام می‌شود.</p>'
 +'<h4>🔁 حاکم دور بعد</h4><p>اگر تیم حاکم ببرد، همان نفر حاکم می‌ماند؛ اگر ببازد، نفر بعدی (خلاف ساعت) حاکم می‌شود.</p>'
 +'<h4>💡 نکته‌ها</h4><p>آس‌های غیرحکم را زود بزنید. حکم‌های کوچک را برای بریدن نگه دارید. اگر هم‌تیمی‌تان دست را می‌برد، کارت کوچک بگذارید. کارت‌های خارج از خال مجاز کمرنگ نشان داده می‌شوند.</p>'
 +'</div><button class="hkbt" data-a="helpclose">متوجه شدم</button></div>',true);
}
function showConfirm(txt,yesLabel,yes){
 pendingYes=yes;
 ovSet('<div class="hkpn"><div class="big">❓</div><h3>'+txt+'</h3><button class="hkbt" data-a="cyes">'+yesLabel+'</button><button class="hkbt g" data-a="cno">ادامه بازی</button></div>',true);
}

/* ---------- عملیات ---------- */
function act(a,v){
 snd('click');
 if(a==='exit'){
  if(G&&G.phase!=='idle'&&G.phase!=='over'&&!OV.classList.contains('on')){showConfirm('از بازی خارج می‌شوید؟','خروج از بازی',exitG);return}
  exitG();return;
 }
 if(a==='snd'||a==='sndset'){
  cfg.snd=a==='snd'?!cfg.snd:!!(+v);saveCfg();hud();
  if(a==='sndset'){OV.querySelector('.hkpn')&&refreshPanel()}
  return;
 }
 if(a==='set'){if(!OV.classList.contains('on'))showCfg();return}
 if(a==='help'){helpRet=OV.classList.contains('on')?back2:null;showHelp();return}
 if(a==='helpclose'){closeHelp();return}
 if(a==='new'){
  if(OV.classList.contains('on'))return;
  if(G&&G.phase!=='idle'&&G.phase!=='over')showConfirm('بازی جدید شروع شود؟','بله، بازی جدید',newGame);else newGame();
  return;
 }
 if(a==='level'){cfg.level=v;if(G)G.level=v;saveCfg();refreshPanel();return}
 if(a==='target'){cfg.target=+v;saveCfg();refreshPanel();return}
 if(a==='hmode'){cfg.hakem=v;saveCfg();refreshPanel();return}
 if(a==='start'||a==='again'){newGame();return}
 if(a==='menu'){gen++;block=0;blocking=false;clearTable();G=null;hud();status('');showStart();return}
 if(a==='resume'){ovHide();return}
 if(a==='cyes'){var f=pendingYes;pendingYes=null;ovHide();if(f)f();return}
 if(a==='cno'){pendingYes=null;ovHide();return}
 if(a==='trump'){
  if(!G||G.phase!=='trump'||G.hakem!==0)return;
  ovHide();dealAfterTrump(+v,false);return;
 }
 if(a==='nextround'){ovHide();beginRound();return}
}
function closeHelp(){var f=helpRet;helpRet=null;if(f)f();else ovHide()}
function refreshPanel(){
 if(back2===showCfg&&OV.classList.contains('on'))showCfg();
 else if(back2===showStart&&OV.classList.contains('on'))showStart();
}

function open(){
 build();
 gen++;block=0;blocking=false;G=null;pendingYes=null;
 HOST.classList.add('on');document.body.classList.add('snkd');
 clearTable();
 requestAnimationFrame(function(){
  chips();hud();relayout();status('');showStart();
 });
}
function exitG(){
 gen++;block=0;blocking=false;G=null;
 if(OV){OV.classList.remove('on');OV.innerHTML=''}
 if(HOST)HOST.classList.remove('on');
 document.body.classList.remove('snkd');
 clearTable();
}
window.hokmOpen=open;

/* کارت منوی سرگرمی: ۴ بازی در شبکهٔ دو ستونه (بازی‌های قبلی با همان توابع قبلی باز می‌شوند) */
window.gmCard=function(){
 return '<div class="c gmc"><b>🎮 سرگرمی</b><div class="gmg">'
 +'<button class="gmk sn" onclick="snkOpen()"><i>🐍</i><b>مار</b><small>کلاسیک و سریع</small></button>'
 +'<button class="gmk g48" onclick="g48Open()"><i>🔢</i><b>۲۰۴۸</b><small>عددها را ترکیب کن</small></button>'
 +'<button class="gmk mem" onclick="gmemOpen()"><i>🧠</i><b>حافظه</b><small>جفت‌یابی تصویری</small></button>'
 +'<button class="gmk hk" onclick="hokmOpen()"><em>جدید</em><i>♠<u>♥</u></i><b>حکم ایرانی</b><small>چهار نفره · دو تیمه</small></button>'
 +'</div></div>';
};

/* دکمهٔ برگشت اندروید: اول حکم، بعد بقیه */
var ob=window.snkBack;
window.snkBack=function(){
 if(HOST&&HOST.classList.contains('on')){
  if(OV.classList.contains('on')){
   if(OV.querySelector('.hkgd')){closeHelp();return true}
   if(OV.querySelector('[data-a="cno"]')){pendingYes=null;ovHide();return true}
   if(OV.querySelector('[data-a="start"]')||OV.querySelector('[data-a="resume"]')){
    if(OV.querySelector('[data-a="resume"]')){ovHide();return true}
    exitG();return true;
   }
   if(OV.querySelector('[data-a="trump"]')||OV.querySelector('[data-a="nextround"]')||OV.querySelector('[data-a="again"]')){
    showConfirm('از بازی خارج می‌شوید؟','خروج از بازی',exitG);return true;
   }
   ovHide();return true;
  }
  if(G&&G.phase!=='idle'&&G.phase!=='over'){showConfirm('از بازی خارج می‌شوید؟','خروج از بازی',exitG);return true}
  exitG();return true;
 }
 return ob?ob():false;
};
})();
</script>
