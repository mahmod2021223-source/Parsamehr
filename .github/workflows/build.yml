name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Capacitor & Build
        run: |
          mkdir www && cp index.html www/
          cat << 'EOF' > patch.js
          const fs = require('fs');
          let h = fs.readFileSync('www/index.html', 'utf8');
          const i1 = h.indexOf('function rDial(n){');
          const i2 = h.indexOf('function rCall(ph){', i1);
          if (i1 !== -1 && i2 !== -1) {
            h = h.slice(0, i1) + 'function rDial(n){try{const N=window.PMNative;if(N&&typeof N.callPhone=="function"&&/^ok/.test(String(N.callPhone(n))))return}catch(e){}location.href="tel:"+n}\n' + h.slice(i2);
          }
          const i3 = h.indexOf('if(/\\bwv\\b/.test(navigator.userAgent)&&!dkNat())throw new Error(');
          if (i3 !== -1) {
            const i4 = h.indexOf(');', i3);
            if (i4 !== -1) h = h.slice(0, i3) + h.slice(i4 + 2);
          }
          fs.writeFileSync('www/index.html', h);
          EOF
          node patch.js
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/browser
          npx cap init "ParsaMehr" "ir.parsamehr.app" --web-dir=www
          npx cap add android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ParsaMehr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
