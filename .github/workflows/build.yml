name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Capacitor & Build
        run: |
          mkdir www && cp index.html www/
          python3 -c 'h=open("www/index.html",encoding="utf-8").read();i1=h.find("function rDial(n){");i2=h.find("function rCall(ph){",i1);h=h[:i1]+"function rDial(n){location.href=\"tel:\"+n}\n"+h[i2:] if i1>0 and i2>i1 else h;i3=h.find("if(/\\bwv\\b/.test(navigator.userAgent)&&!dkNat())throw new Error(");i4=h.find(");",i3);h=h[:i3]+h[i4+2:] if i3>0 and i4>i3 else h;open("www/index.html","w",encoding="utf-8").write(h)'
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @capacitor/browser
          npx cap init "ParsaMehr" "ir.parsamehr.app" --web-dir=www
          npx cap add android
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ParsaMehr-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
