name: Build Release App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Capacitor & Build Release
        run: |
          APP_NAME="مستر حساب ۲"
          APP_ID="ir.parsamehr.v2"
          if [ -f "app.txt" ]; then
            LINE1=$(sed -n '1p' app.txt | tr -d '\r\n' | xargs)
            LINE2=$(sed -n '2p' app.txt | tr -d '\r\n' | tr -d ' ')
            [ -n "$LINE1" ] && APP_NAME="$LINE1"
            [ -n "$LINE2" ] && APP_ID="$LINE2"
          fi
          mkdir www && cp index.html www/
          node -e 'const fs=require("fs");let h=fs.readFileSync("www/index.html","utf8");h=h.replace("if(/\\bwv\\b/.test(navigator.userAgent)||","if(false&&");h=h.replace("if(/\\bwv\\b/.test(navigator.userAgent)&&!dkNat())","if(false)");fs.writeFileSync("www/index.html",h);'
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share @aparajita/capacitor-biometric-auth capacitor-native-biometric @capgo/capacitor-native-biometric
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/versionCode 1/versionCode 4/g' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.3"/g' android/app/build.gradle
          if [ -f "icon.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                convert icon.png -resize 192x192! PNG32:"$dir/ic_launcher.png" || cp icon.png "$dir/ic_launcher.png"
                convert icon.png -resize 192x192! PNG32:"$dir/ic_launcher_round.png" || cp icon.png "$dir/ic_launcher_round.png"
                convert icon.png -resize 192x192! PNG32:"$dir/ic_launcher_foreground.png" || cp icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi
          sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"\/><uses-permission android:name="android.permission.USE_BIOMETRIC"\/><uses-permission android:name="android.permission.USE_FINGERPRINT"\/><\/manifest>/' android/app/src/main/AndroidManifest.xml
          if [ -f "release.keystore" ]; then
            cp release.keystore android/app/release.keystore
          else
            keytool -genkey -v -keystore android/app/release.keystore -alias parsamehr -keyalg RSA -keysize 2048 -validity 10000 -storepass parsamehr123 -keypass parsamehr123 -dname "CN=ParsaMehr, OU=Mobile, O=ParsaMehr, L=Tehran, S=Tehran, C=IR"
          fi
          cd android && chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools \vert{} tail -n 1)$BUILD_TOOLS/zip
